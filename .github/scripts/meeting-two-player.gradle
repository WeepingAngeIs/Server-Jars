// Separate game directories and identities are mandatory for simultaneous clients.
allprojects {
    afterEvaluate {
        def loader = extensions.findByName('neoForge')
        if (loader != null) {
            def clientHeap = System.getenv('UQ_PACKAGED_JAIL_SMOKE') == '1' ? '-Xmx2200m' : '-Xmx1200m'
            loader.runs.named('server') {
                jvmArgument '-Xmx1536m'
            }
            loader.runs.named('client') {
                jvmArgument clientHeap
                programArguments.addAll('--quickPlayMultiplayer', '127.0.0.1:25565', '--username', 'Dev', '--width', '640', '--height', '480')
            }
            loader.runs.register('visitor') {
                client()
                gameDirectory = project.file('run-visitor')
                jvmArgument clientHeap
                programArguments.addAll('--quickPlayMultiplayer', '127.0.0.1:25565', '--username', 'Visitor', '--width', '640', '--height', '480')
            }
        }
    }
}
