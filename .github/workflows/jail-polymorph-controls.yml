name: Polymorph native controls and stock admission
on:
  push:
    branches: [codex/jail-unyielding-249]
    paths: ['minecraft-jail/**', '.github/native249/**', '.github/polymorph249/**', '.github/workflows/jail-polymorph-controls.yml']
permissions:
  actions: read
  contents: read
jobs:
  native-controls:
    if: contains(github.event.head_commit.message, '[polymorph-controls]')
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    env:
      UQ_ACCESSORY_INTEGRATION: '1'
      POLYMORPH_CONTROLS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: jail-production-build-7b2f6b34412403b0839f1be9b82e136d1d893b20
          run-id: 44099299150
          github-token: ${{ github.token }}
          path: baseline
      - name: Build and unit test the candidate
        run: |
          set -euo pipefail
          python3 .github/scripts/fetch-build-dependencies.py
          mkdir -p minecraft-jail/libs dist/120-release
          cp unyielding-quests/libs/{cobblemon,kotlin-stdlib}.jar minecraft-jail/libs/
          cp baseline/dist/production-candidate/Unyielding-1.2.0.jar dist/120-release/
          (cd minecraft-jail && sh gradlew --no-daemon --console=plain clean test jar)
          cp minecraft-jail/build/libs/Minecraft-Jail-1.3.0-beta.3.jar minecraft-jail/build/libs/Minecraft-Jail-1.2.0.jar
          sha256sum minecraft-jail/build/libs/Minecraft-Jail-1.3.0-beta.3.jar > dist/candidate.sha256
      - name: Build the stock native provider observer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for path, old, new in [
              (Path('.github/native249/FullPackSession.java'), '<=80', '<=2400'),
              (Path('.github/native249/full_run.py'), '<= 80', '<= 2400'),
          ]:
              text=path.read_text()
              assert text.count(old)==1, path
              path.write_text(text.replace(old,new))
          PY
          python3 .github/native249/full_prepare.py
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 libopenal1 libxrandr2 libxcursor1 libxinerama1
      - name: Provision stock dedicated server and client
        run: |
          python3 -m pip install --disable-pip-version-check minecraft-launcher-lib==8.0
          bash .github/client249/memory.sh
          PACK249_INSTALL_ONLY=1 bash .github/pack249/server.sh
          python3 .github/pack249/provision.py --side client --dest "$RUNNER_TEMP/pack249-client-native"
          python3 .github/client249/launch.py "$RUNNER_TEMP/pack249-client-native" --install-only
      - name: Observe native controls, admission and automatic respawn
        timeout-minutes: 35
        run: bash .github/native249/game-scope.sh 1 minecraft-jail/build/libs/Minecraft-Jail-1.3.0-beta.3.jar
      - name: Restart and return the exact held inventory and wallet
        timeout-minutes: 25
        run: bash .github/native249/game-scope.sh 2 minecraft-jail/build/libs/Minecraft-Jail-1.3.0-beta.3.jar
      - name: Verify controls ran
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          proof=json.loads(Path('dist/packaged-smoke/center-phase1.json').read_text())
          assert proof.get('polymorph_native_controls') is True
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: polymorph-native-controls-${{ github.sha }}
          path: |
            dist/candidate.sha256
            minecraft-jail/build/libs/Minecraft-Jail-1.3.0-beta.3.jar
            minecraft-jail/build/test-results/
            dist/packaged-smoke/
          retention-days: 10
