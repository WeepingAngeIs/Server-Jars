name: Audit bounded packed-wallet custody APIs
on:
  workflow_dispatch:
  push:
    branches: ['codex/jail-standalone-extraction']
    paths: ['.github/workflows/jail-packed-wallet-audit.yml']
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      UQ_ACCESSORY_INTEGRATION: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: minecraft-jail-runtime-verified-4e3667a149d4e530bddb5326ee739ad386fe6a47
          run-id: 43928823842
          github-token: ${{ github.token }}
          path: dist/original-verified/
      - name: Inspect exact reviewed dependency without launching a game
        shell: bash
        run: |
          set -euo pipefail
          cd dist/original-verified
          printf '%s\n' 'd3145b1bc8f04c0370db30ff10e87158b6c3c88c0fde68cb0f226d3b73f79baf  Minecraft-Jail-1.2.0.jar' '61f6add6c68364b1c9dda4486948faf8d104c45ca2db2c40199de64a04ea38f7  Unyielding-1.2.0.jar' | sha256sum -c -
          cd ../..
          mkdir -p dist/120-release minecraft-jail/build/libs dist/wallet-audit
          cp dist/original-verified/Unyielding-1.2.0.jar dist/120-release/
          cp dist/original-verified/Minecraft-Jail-1.2.0.jar minecraft-jail/build/libs/
          python3 .github/scripts/fetch-build-dependencies.py
          python3 .github/scripts/prepare-split-server.py
          python3 - <<'PY'
          from pathlib import Path
          import subprocess, zipfile, hashlib
          root=Path('dist/wallet-audit')
          classes=['io.github.lightman314.lightmanscurrency.common.items.WalletItem','io.github.lightman314.lightmanscurrency.common.items.data.WalletData','io.github.lightman314.lightmanscurrency.common.items.data.WalletDataWrapper','io.github.lightman314.lightmanscurrency.common.attachments.WalletHandler','io.github.lightman314.lightmanscurrency.common.core.ModDataComponents','io.github.lightman314.lightmanscurrency.integration.curios.LCCurios']
          jars=[p for p in Path('dist/packaged-harness/libs').glob('*.jar') if classes[0].replace('.','/')+'.class' in zipfile.ZipFile(p).namelist()]
          assert len(jars)==1
          jar=jars[0]
          (root/'dependency.sha512').write_text(hashlib.sha512(jar.read_bytes()).hexdigest()+'  '+jar.name+'\n')
          for name in classes:
              (root/(name.rsplit('.',1)[-1]+'.javap')).write_text(subprocess.run(['javap','-p','-c','-classpath',str(jar),name],capture_output=True,text=True,check=True).stdout)
          (root/'commit.txt').write_text(subprocess.check_output(['git','rev-parse','HEAD'],text=True))
          subprocess.run(['git','archive','--format=zip','-o',str(root/'jail-source.zip'),'HEAD','AGENTS.md','minecraft-jail','.github','docs','tools','unyielding-quests/build.gradle','unyielding-quests/gradle.properties','unyielding-quests/gradle','unyielding-quests/gradlew','unyielding-quests/settings.gradle'],check=True)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jail-packed-wallet-api-audit-${{ github.sha }}
          path: dist/wallet-audit/
          retention-days: 30
          if-no-files-found: error
