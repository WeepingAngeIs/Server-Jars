name: Meeting two-player candidate smoke
on:
  workflow_dispatch:
  push:
    branches: ['codex/recovery-review-safe']
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare dependencies
        run: |
          python3 .github/scripts/fetch-build-dependencies.py
          for d in run-server run run-visitor; do mkdir -p "unyielding-quests/$d/mods"; done
          curl --fail --location --retry 3 'https://cdn.modrinth.com/data/gF3BGWvG/versions/yWmXD7GW/open-parties-and-claims-neoforge-1.21.1-0.33.0.jar' -o unyielding-quests/run-server/mods/opac.jar
          echo '646fd9796ef2dfd1132e22aacf1a417639233d90fb7eb862a718badfed955d54714c88327b7ddc651f98cd5b7d2a80e8c91233d2232680d4998fdd10ef392ffb  unyielding-quests/run-server/mods/opac.jar' | sha512sum -c -
          cp unyielding-quests/run-server/mods/opac.jar unyielding-quests/run/mods/
          cp unyielding-quests/run-server/mods/opac.jar unyielding-quests/run-visitor/mods/
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 libopenal1 libxrandr2 libxcursor1 libxinerama1
      - name: Run candidate with two independent clients
        env:
          JAVA_TOOL_OPTIONS: -Duq.meetingTwoPlayer=true
          LIBGL_ALWAYS_SOFTWARE: 'true'
          ALSOFT_DRIVERS: 'null'
        run: bash .github/scripts/meeting-two-player.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: meeting-two-player-candidate-logs
          path: meeting-two-player-logs/
          if-no-files-found: warn
