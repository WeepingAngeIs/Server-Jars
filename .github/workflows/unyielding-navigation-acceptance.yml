name: Independent jail-free party and quest navigation acceptance
on:
  workflow_dispatch:
  push:
    branches: ['codex/unyielding-navigation-acceptance']
    paths:
      - '.github/navigation-acceptance/**'
      - '.github/scripts/prepare-navigation-acceptance.py'
      - '.github/scripts/navigation-acceptance.sh'
      - '.github/workflows/unyielding-navigation-acceptance.yml'
      - 'unyielding-quests/src/main/java/dev/unyielding/quests/client/TeamScreen.java'
      - 'unyielding-quests/src/main/java/dev/unyielding/quests/client/QuestScreen.java'
      - 'unyielding-quests/src/main/java/dev/unyielding/quests/team/**'
permissions:
  contents: read
  actions: read
jobs:
  navigation:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: unyielding-quests/*.gradle
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: unyielding-config-audit-acceptance
          run-id: 44043593748
          github-token: ${{ github.token }}
          path: dist/baseline-artifact
      - name: Stage verified candidate; build only a reproduced production fix
        run: |
          git fetch --no-tags --depth=1 origin cd909503789660c4d7c54d71194d9b359287ee25
          python3 .github/scripts/fetch-build-dependencies.py
          mkdir -p dist/120-release
          cp dist/baseline-artifact/dist/120-release/Unyielding-1.2.0.jar dist/120-release/
          printf '%s\n' '216de93ca87cc9e0a54f0f0991c675a1058ee95de3247c8efbebffc664f0c504  dist/120-release/Unyielding-1.2.0.jar' | sha256sum -c -
          if ! git diff --quiet cd909503789660c4d7c54d71194d9b359287ee25 HEAD -- unyielding-quests/src/main .github/scripts/assemble-118-followup.py; then
            (cd unyielding-quests && ./gradlew --no-daemon --console=plain build)
            python3 .github/scripts/assemble-118-followup.py
          fi
      - name: Prepare disposable clients and synthetic navigation data
        run: python3 .github/scripts/prepare-navigation-acceptance.py
      - name: Run eight native UI boundaries on GitHub-hosted displays
        env:
          LIBGL_ALWAYS_SOFTWARE: 'true'
          ALSOFT_DRIVERS: 'null'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 libopenal1 libxrandr2 libxcursor1 libxinerama1
          bash .github/scripts/navigation-acceptance.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: unyielding-navigation-acceptance
          path: |
            dist/120-release/
            dist/navigation-acceptance/
            unyielding-quests/build/test-results/test/
          if-no-files-found: error
