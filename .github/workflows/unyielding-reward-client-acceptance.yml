name: Independent jail-free connected-client reward acceptance
on:
  workflow_dispatch:
  push:
    branches: ['codex/unyielding-reward-client-acceptance']
    paths:
      - '.github/reward-client-acceptance/**'
      - '.github/scripts/prepare-reward-client-acceptance.py'
      - '.github/scripts/reward-client-acceptance.sh'
      - '.github/workflows/unyielding-reward-client-acceptance.yml'
      - 'unyielding-quests/src/main/java/dev/unyielding/quests/spin/**'
      - 'unyielding-quests/src/main/java/dev/unyielding/quests/quest/QuestManager.java'
permissions:
  contents: read
  actions: read
jobs:
  reward-client:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: unyielding-quests/*.gradle
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: unyielding-ground-acceptance
          run-id: 44019741055
          github-token: ${{ github.token }}
          path: dist/baseline-artifact
      - name: Stage verified ground candidate; build only a reproduced production fix
        run: |
          git fetch --no-tags --depth=1 origin c93c578a5507af7657c2351b95caeabf8d434f1d
          python3 .github/scripts/fetch-build-dependencies.py
          mkdir -p dist/120-release
          cp dist/baseline-artifact/dist/120-release/Unyielding-1.2.0.jar dist/120-release/
          printf '%s\n' 'be397290bfbac8d8f0b1010d04daded458673eca2f97b6e0eff59272e2eec886  dist/120-release/Unyielding-1.2.0.jar' | sha256sum -c -
          if ! git diff --quiet c93c578a5507af7657c2351b95caeabf8d434f1d HEAD -- unyielding-quests/src/main .github/scripts/assemble-118-followup.py; then
            (cd unyielding-quests && ./gradlew --no-daemon --console=plain build)
            python3 .github/scripts/assemble-118-followup.py
          fi
      - name: Prepare disposable public clients and reward fixture
        run: |
          python3 .github/scripts/prepare-reward-client-acceptance.py
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 libopenal1 libxrandr2 libxcursor1 libxinerama1
      - name: Regress claim validation and verify newly credited spin redemption
        env:
          LIBGL_ALWAYS_SOFTWARE: 'true'
          ALSOFT_DRIVERS: 'null'
          UQ_REWARD_CLIENT_SCOPE: claims
        run: bash .github/scripts/reward-client-acceptance.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: unyielding-reward-client-acceptance
          path: |
            dist/120-release/
            dist/reward-client-acceptance/
            unyielding-quests/build/test-results/test/
          if-no-files-found: error
