name: Cobblemon Unyielding 21.1.249 verification
on:
  push:
    branches: [codex/jail-unyielding-249]
    paths: ['minecraft-jail/**', '.github/client249/**', '.github/native249/**', '.github/pack249/**', '.github/detention/**', '.github/items249/**', '.github/workflows/jail-unyielding-249.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: jail249-${{ github.sha }}
  cancel-in-progress: false
jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[combined-probe]') && !contains(github.event.head_commit.message, '[polymorph-controls]')"
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: minecraft-jail/*.gradle
      - name: Compile real production candidate and run units
        run: |
          set -euo pipefail
          mkdir -p dist/migration-build
          python3 .github/scripts/fetch-build-dependencies.py
          mkdir -p minecraft-jail/libs
          cp unyielding-quests/libs/cobblemon.jar unyielding-quests/libs/kotlin-stdlib.jar minecraft-jail/libs/
          (cd minecraft-jail && sh gradlew --no-daemon --console=plain -I ../.github/client249/probe.gradle clean test jar privatePackClientProbeJar) 2>&1 | tee dist/migration-build/gradle.log
      - name: Collect JAR, source and test results
        if: always()
        run: |
          mkdir -p dist/migration-build
          git archive --format=zip -o dist/migration-build/source.zip HEAD minecraft-jail unyielding-quests/gradlew unyielding-quests/gradle/wrapper unyielding-quests/src/main/java/dev/unyielding/quests/devtest combined-unyielding/prepare_smoke.py combined-unyielding/smoke-harness .github/scripts/fetch-build-dependencies.py .github/scripts/meeting-two-player.sh .github/scripts/meeting-two-player.gradle .github/scripts/prepare-split-server.py .github/scripts/prepare-packaged-server.py .github/scripts/install-origin-test-runtime.py .github/packed-wallet/PackedWalletProof.java .github/packaged-smoke/BundleSmoke.java .github/player-only/PlayerOnlySmoke.java .github/player-only/PlayerOnlyClient.java .github/jail-production .github/split-smoke .github/workflows/jail-unyielding-249.yml .github/detention .github/occupied-migration .github/pack249 .github/native249 .github/client249 .github/items249 .github/workflows/jail-items249.yml
          git rev-parse HEAD > dist/migration-build/commit.txt
          cp minecraft-jail/build/probe/*.jar dist/migration-build/ 2>/dev/null || true
          cp minecraft-jail/build/libs/*.jar dist/migration-build/ 2>/dev/null || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: jail-249-build-${{ github.sha }}
          path: |
            dist/migration-build/
            minecraft-jail/build/test-results/
          if-no-files-found: error
          retention-days: 30

  pack-server:
    if: "!contains(github.event.head_commit.message, '[items-probe]') && !contains(github.event.head_commit.message, '[pack-probe]') && !contains(github.event.head_commit.message, '[migration-probe]') && !contains(github.event.head_commit.message, '[client-probe]')"
    strategy:
      fail-fast: false
      matrix:
        boot: [a, b]
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      UQ_ACCESSORY_INTEGRATION: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: jail-249-build-${{ github.sha }}
          path: candidate
      - name: Start the published pack on a disposable dedicated server
        run: bash .github/pack249/server.sh "$PWD/candidate/dist/migration-build/Minecraft-Jail-1.3.0-beta.3.jar"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pack249-server-${{ matrix.boot }}-${{ github.sha }}
          path: dist/pack249
          retention-days: 10
  custody:
    if: "!contains(github.event.head_commit.message, '[items-probe]') && !contains(github.event.head_commit.message, '[migration-probe]') && !contains(github.event.head_commit.message, '[pack-probe]') && !contains(github.event.head_commit.message, '[client-probe]')"
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      UQ_ACCESSORY_INTEGRATION: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: jail-249-build-${{ github.sha }}
          path: candidate
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: jail-production-build-7b2f6b34412403b0839f1be9b82e136d1d893b20
          run-id: 44099299150
          github-token: ${{ github.token }}
          path: baseline
      - name: Set up two independent test clients
        run: |
          mkdir -p dist/120-release minecraft-jail/build/libs
          cp baseline/dist/production-candidate/Unyielding-1.2.0.jar dist/120-release/
          cp candidate/dist/migration-build/Minecraft-Jail-1.3.0-beta.3.jar minecraft-jail/build/libs/Minecraft-Jail-1.2.0.jar
          python3 .github/scripts/fetch-build-dependencies.py
          python3 .github/native249/prepare.py
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 libopenal1 libxrandr2 libxcursor1 libxinerama1
      - name: Exercise real jail and wallet transactions on .249
        run: bash .github/native249/run.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pack249-bounded-${{ github.sha }}
          path: dist/packaged-smoke
          retention-days: 10

  pack-client:
    if: "!contains(github.event.head_commit.message, '[items-probe]') && !contains(github.event.head_commit.message, '[migration-probe]') && !contains(github.event.head_commit.message, '[pack-probe]')"
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      UQ_ACCESSORY_INTEGRATION: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: jail-249-build-${{ github.sha }}
          path: candidate
      - name: Launch all 365 pack mods with the candidate and verify Rosecourt models
        run: |
          python3 -m pip install --disable-pip-version-check minecraft-launcher-lib==8.0
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 libopenal1
          bash .github/client249/memory.sh
          game="$RUNNER_TEMP/client249-game"
          mkdir -p "$game" dist/client249
          python3 .github/pack249/provision.py --side client --dest "$game"
          cp candidate/dist/migration-build/*.jar "$game/mods/"
          echo 'onboardAccessibility:false' > "$game/options.txt"
          export CLIENT249_REPORT="$PWD/dist/client249/readiness.json" LIBGL_ALWAYS_SOFTWARE=true ALSOFT_DRIVERS=null
          timeout 20m xvfb-run -a -s '-screen 0 854x480x24' python3 .github/client249/launch.py "$game" > dist/client249/launcher.log 2>&1
          test -s "$CLIENT249_REPORT"
      - name: Record client diagnostics
        if: always()
        run: |
          mkdir -p dist/client249
          cp "$RUNNER_TEMP/client249-game/logs/latest.log" dist/client249/ 2>/dev/null || true
          cp "$RUNNER_TEMP/client249-game"/crash-reports/*.txt dist/client249/ 2>/dev/null || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pack249-client-${{ github.sha }}
          path: dist/client249
          retention-days: 10

  pack-custody:
    if: "!contains(github.event.head_commit.message, '[items-release]') && !contains(github.event.head_commit.message, '[items-probe]') && !contains(github.event.head_commit.message, '[migration-probe]') && !contains(github.event.head_commit.message, '[client-probe]')"
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    env:
      UQ_ACCESSORY_INTEGRATION: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: jail-249-build-${{ github.sha }}
          path: candidate
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: jail-production-build-7b2f6b34412403b0839f1be9b82e136d1d893b20
          run-id: 44099299150
          github-token: ${{ github.token }}
          path: baseline
      - name: Build the independent full-pack test mod
        run: |
          mkdir -p dist/120-release minecraft-jail/build/libs
          cp baseline/dist/production-candidate/Unyielding-1.2.0.jar dist/120-release/
          cp candidate/dist/migration-build/Minecraft-Jail-1.3.0-beta.3.jar minecraft-jail/build/libs/Minecraft-Jail-1.2.0.jar
          python3 .github/scripts/fetch-build-dependencies.py
          python3 .github/native249/full_prepare.py
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 libopenal1 libxrandr2 libxcursor1 libxinerama1
      - name: Prepare exact client and matching dedicated server on loopback
        run: |
          python3 -m pip install --disable-pip-version-check minecraft-launcher-lib==8.0
          bash .github/client249/memory.sh
          PACK249_INSTALL_ONLY=1 bash .github/pack249/server.sh
          python3 .github/pack249/provision.py --side client --dest "$RUNNER_TEMP/pack249-client-native"
          python3 .github/client249/launch.py "$RUNNER_TEMP/pack249-client-native" --install-only
      - name: Admit a packed wallet and verify the automatic escape respawn
        timeout-minutes: 30
        run: bash .github/native249/game-scope.sh 1 candidate/dist/migration-build/Minecraft-Jail-1.3.0-beta.3.jar
      - name: Save first-session evidence before the restart
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pack249-first-session-${{ github.sha }}
          path: |
            dist/packaged-smoke/*.json
            dist/packaged-smoke/client249-phase1-status.txt
            dist/packaged-smoke/full249-phase1-logs
            dist/packaged-smoke/full249-scope-logs
          retention-days: 10
      - name: Reconnect and verify the exact wallet and inventory return
        timeout-minutes: 30
        run: bash .github/native249/game-scope.sh 2 candidate/dist/migration-build/Minecraft-Jail-1.3.0-beta.3.jar
      - name: Preserve server and client diagnostics
        if: always()
        run: |
          mkdir -p dist/packaged-smoke/full-crashes
          cp "$RUNNER_TEMP/pack249-server"/crash-reports/*.txt dist/packaged-smoke/full-crashes/ 2>/dev/null || true
          cp "$RUNNER_TEMP/pack249-client-native"/crash-reports/*.txt dist/packaged-smoke/full-crashes/ 2>/dev/null || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pack249-full-custody-${{ github.sha }}
          path: |
            dist/packaged-smoke/*.json
            dist/packaged-smoke/*.snbt
            dist/packaged-smoke/full249-onboarding-*.txt
            dist/packaged-smoke/client249-phase*-status.txt
            dist/packaged-smoke/full249-*-logs
            dist/packaged-smoke/full-crashes
          retention-days: 10

  migration:
    if: "!contains(github.event.head_commit.message, '[items-probe]') && !contains(github.event.head_commit.message, '[pack-probe]') && !contains(github.event.head_commit.message, '[client-probe]')"
    name: Occupied save ${{ matrix.suite }}
    strategy:
      fail-fast: false
      matrix:
        suite: [same-loader, changed-loader]
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      UQ_ACCESSORY_INTEGRATION: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: jail-249-build-${{ github.sha }}
          path: candidate/
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: jail-production-build-7b2f6b34412403b0839f1be9b82e136d1d893b20
          run-id: 44099299150
          github-token: ${{ github.token }}
          path: old-evidence/
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: jail-migration-build-0bd7f3297d47b7de5e17ae79cba3b95c52b14f97
          run-id: 44120884857
          github-token: ${{ github.token }}
          path: attached/
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: matrix.suite == 'changed-loader'
        with:
          name: jail-detention-migration-d4b4dfd4dcb43a797d3c959bc5e8fba68ac0c31a
          run-id: 44229735604
          github-token: ${{ github.token }}
          path: occupied/
      - name: Prepare disposable exact-artifact runtime and unchanged companion
        run: |
          set -euo pipefail
          mkdir -p dist/120-release minecraft-jail/build/libs
          cp old-evidence/dist/production-candidate/Unyielding-1.2.0.jar dist/120-release/
          cp candidate/dist/migration-build/Minecraft-Jail-1.3.0-beta.3.jar minecraft-jail/build/libs/Minecraft-Jail-1.2.0.jar
          python3 .github/scripts/fetch-build-dependencies.py
          python3 .github/occupied-migration/prepare.py
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 libopenal1 libxrandr2 libxcursor1 libxinerama1
      - name: Exact predecessor occupied save, interruptions, tampering, restart, native escape and return
        env:
          MIGRATION_CANDIDATE: candidate/dist/migration-build/Minecraft-Jail-1.3.0-beta.3.jar
          MIGRATION_PREDECESSOR: attached/dist/migration-build/Minecraft-Jail-1.2.0.jar
          MIGRATION_OLD_SHA256: 5e2b40e36f2c6036005bed46c62f5da6b5faa7b8f77becec2ec334aa83990cd8
        run: |
          if [[ '${{ matrix.suite }}' == same-loader ]]; then
            bash .github/occupied-migration/run.sh
          else
            python3 .github/native249/changed_loader.py
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pack249-migration-${{ matrix.suite }}-${{ github.sha }}
          path: |
            dist/packaged-smoke/
            dist/packaged-harness/src/
          if-no-files-found: error
          retention-days: 30
