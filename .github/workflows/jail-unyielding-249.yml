name: Cobblemon Unyielding 21.1.249 verification
on:
  push:
    branches: [codex/jail-unyielding-249]
    paths: ['minecraft-jail/**', '.github/native249/**', '.github/pack249/**', '.github/detention/**', '.github/workflows/jail-unyielding-249.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: jail249-${{ github.sha }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: minecraft-jail/*.gradle
      - name: Compile real production candidate and run units
        run: |
          set -euo pipefail
          mkdir -p dist/migration-build
          python3 .github/scripts/fetch-build-dependencies.py
          mkdir -p minecraft-jail/libs
          cp unyielding-quests/libs/cobblemon.jar unyielding-quests/libs/kotlin-stdlib.jar minecraft-jail/libs/
          (cd minecraft-jail && sh gradlew --no-daemon --console=plain clean test jar) 2>&1 | tee dist/migration-build/gradle.log
      - name: Collect JAR, source and test results
        if: always()
        run: |
          mkdir -p dist/migration-build
          git archive --format=zip -o dist/migration-build/source.zip HEAD minecraft-jail unyielding-quests/gradlew unyielding-quests/gradle/wrapper .github/scripts/fetch-build-dependencies.py .github/workflows/jail-unyielding-249.yml .github/detention .github/occupied-migration .github/pack249 .github/native249
          git rev-parse HEAD > dist/migration-build/commit.txt
          cp minecraft-jail/build/libs/*.jar dist/migration-build/ 2>/dev/null || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: jail-249-build-${{ github.sha }}
          path: |
            dist/migration-build/
            minecraft-jail/build/test-results/
          if-no-files-found: error
          retention-days: 30

  pack-server:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      UQ_ACCESSORY_INTEGRATION: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: jail-249-build-${{ github.sha }}
          path: candidate
      - name: Start the published pack on a disposable dedicated server
        run: bash .github/pack249/server.sh "$PWD/candidate/dist/migration-build/Minecraft-Jail-1.3.0-beta.2.jar"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pack249-server-${{ github.sha }}
          path: dist/pack249
          retention-days: 10
  custody:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      UQ_ACCESSORY_INTEGRATION: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: jail-249-build-${{ github.sha }}
          path: candidate
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: jail-production-build-7b2f6b34412403b0839f1be9b82e136d1d893b20
          run-id: 44099299150
          github-token: ${{ github.token }}
          path: baseline
      - name: Set up two independent test clients
        run: |
          mkdir -p dist/120-release minecraft-jail/build/libs
          cp baseline/dist/production-candidate/Unyielding-1.2.0.jar dist/120-release/
          cp candidate/dist/migration-build/*.jar minecraft-jail/build/libs/Minecraft-Jail-1.2.0.jar
          python3 .github/scripts/fetch-build-dependencies.py
          python3 .github/native249/prepare.py
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 libopenal1 libxrandr2 libxcursor1 libxinerama1
      - name: Exercise real jail and wallet transactions on .249
        run: bash .github/native249/run.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pack249-bounded-${{ github.sha }}
          path: dist/packaged-smoke
          retention-days: 10
