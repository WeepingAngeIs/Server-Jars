name: Correct bounded wallet fixture bookkeeping
on:
  push:
    branches: ['codex/jail-packed-wallet-custody']
    paths: ['.github/workflows/jail-wallet-fixture-fix.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Preserve selected synthetic equipment and recognize only actual offline refusal
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/codex/jail-packed-wallet-custody
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          p=Path('.github/packed-wallet/PackedWalletCustodySmoke.java')
          expected=subprocess.check_output(['git','show','38880caae01ca1acf10e8e065609b04c43990262:'+str(p)])
          assert p.read_bytes()==expected
          s=p.read_text()
          old='ItemStack captured=player.getInventory().getItem(SLOT);player.getInventory().setItem(SLOT,ItemStack.EMPTY);player.getInventory().setItem(player.getInventory().selected,captured);'
          new='ItemStack selectedBefore=player.getInventory().removeItemNoUpdate(player.getInventory().selected);ItemStack captured=player.getInventory().getItem(SLOT);player.getInventory().setItem(SLOT,ItemStack.EMPTY);player.getInventory().setItem(player.getInventory().selected,captured);'
          assert s.count(old)==1;s=s.replace(old,new,1)
          old='player.getInventory().setItem(player.getInventory().selected,ItemStack.EMPTY);player.getInventory().setItem(SLOT,captured);'
          new='player.getInventory().setItem(player.getInventory().selected,selectedBefore);player.getInventory().setItem(SLOT,captured);'
          assert s.count(old)==1;s=s.replace(old,new,1)
          old='proof(command("unjail Visitor")==0,"offline_release_refused");'
          new='offlineRefusal();'
          assert s.count(old)==1;s=s.replace(old,new,1)
          old='    static void disconnect()throws Exception {save();waiting=true;player.connection.disconnect(Component.literal("Disposable packed wallet persistence test"));}'
          new='''    static void offlineRefusal()throws Exception {
                  require(admin.server.getPlayerList().getPlayer(owner)==null,"Offline negative control has a live target");
                  var before=binding();boolean refused=false;
                  try{refused=command("unjail Visitor")==0;}
                  catch(com.mojang.brigadier.exceptions.CommandSyntaxException expected){
                      require(expected.getRawMessage().getString().equals("No player was found"),"Unexpected parser failure: "+expected);
                      refused=true;
                  }
                  proof(refused&&before.equals(binding()),"offline_release_refused");
              }
              static void disconnect()throws Exception {save();waiting=true;player.connection.disconnect(Component.literal("Disposable packed wallet persistence test"));}'''
          assert s.count(old)==1;s=s.replace(old,new,1)
          p.write_text(s)
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/packed-wallet/PackedWalletCustodySmoke.java
          git commit -m 'Preserve preexisting synthetic sword in negative test and verify offline command refusal without changing production'
          git fetch origin codex/jail-packed-wallet-custody
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/codex/jail-packed-wallet-custody
          mkdir -p dist/fixture-source
          git archive --format=zip -o dist/fixture-source/current-source.zip HEAD AGENTS.md minecraft-jail .github docs tools
          git rev-parse HEAD > dist/fixture-source/commit.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: packed-wallet-fixture-source
          path: dist/fixture-source/
          retention-days: 30
          if-no-files-found: error
