name: Independent jail-free ground cleanup multiplayer acceptance
on:
  workflow_dispatch:
  push:
    branches: ['codex/unyielding-ground-acceptance']
    paths:
      - '.github/ground-acceptance/**'
      - '.github/scripts/prepare-ground-acceptance.py'
      - '.github/scripts/ground-acceptance.sh'
      - '.github/workflows/unyielding-ground-acceptance.yml'
      - 'unyielding-quests/src/main/java/dev/unyielding/quests/settings/GroundSettings.java'
      - 'unyielding-quests/src/main/resources/data/cui_cleanup/**'
permissions:
  contents: read
  actions: read
jobs:
  ground:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: unyielding-quests/*.gradle
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: unyielding-vein-protection
          run-id: 44003918234
          github-token: ${{ github.token }}
          path: dist/baseline-artifact
      - name: Stage exact current candidate; build only if production changes
        run: |
          git fetch --no-tags --depth=1 origin 37da182759caacfa2346a0c4cd1e187056a753a7
          python3 .github/scripts/fetch-build-dependencies.py
          mkdir -p dist/120-release
          cp dist/baseline-artifact/dist/120-release/Unyielding-1.2.0.jar dist/120-release/
          printf '%s\n' '7a0a1cec09001ca6f47ee6180371842f27ef6d83f7411a7e61fff6a83e74b414  dist/120-release/Unyielding-1.2.0.jar' | sha256sum -c -
          if ! git diff --quiet 37da182759caacfa2346a0c4cd1e187056a753a7 HEAD -- unyielding-quests/src/main .github/scripts/assemble-118-followup.py; then
            (cd unyielding-quests && ./gradlew --no-daemon --console=plain build)
            python3 .github/scripts/assemble-118-followup.py
          fi
      - name: Prepare isolated actual-client item fixture
        run: |
          python3 .github/scripts/prepare-ground-acceptance.py
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 libopenal1 libxrandr2 libxcursor1 libxinerama1
      - name: Verify native merging, multiplayer preview and restart boundaries
        env:
          LIBGL_ALWAYS_SOFTWARE: 'true'
          ALSOFT_DRIVERS: 'null'
        run: bash .github/scripts/ground-acceptance.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: unyielding-ground-acceptance
          path: |
            dist/120-release/
            dist/ground-acceptance/
            unyielding-quests/build/test-results/test/
          if-no-files-found: error
