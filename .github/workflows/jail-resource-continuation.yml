name: Jail resource continuation and durable release checks
on:
  workflow_dispatch:
  push:
    branches: ['codex/jail-standalone-extraction']
    paths:
      - '.github/resource-continuation/**'
      - '.github/workflows/jail-resource-continuation.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: resource-continuation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  preflight-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: python3 -m unittest discover -s .github/resource-continuation -p 'test_*.py' -v
      - run: python3 -m unittest discover -s tools/jail-sandbox -p 'test_*.py' -v
  native-preservation:
    needs: preflight-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        kind: [party, wallet, both]
    env:
      UQ_ACCESSORY_INTEGRATION: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            unyielding-quests/*.gradle
            unyielding-quests/gradle/wrapper/gradle-wrapper.properties
            combined-unyielding/smoke-harness/*.gradle
      - name: Require production to remain exactly at the verified split
        run: |
          git fetch --no-tags --depth=1 origin 4e3667a149d4e530bddb5326ee739ad386fe6a47
          git diff --exit-code 4e3667a149d4e530bddb5326ee739ad386fe6a47 HEAD -- minecraft-jail unyielding-quests combined-unyielding currency-bridge iv-substitute-update model-hotfix riding-update settings-update tutorial-update
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: minecraft-jail-runtime-verified-4e3667a149d4e530bddb5326ee739ad386fe6a47
          run-id: 43928823842
          github-token: ${{ github.token }}
          path: dist/original-verified/
      - name: Stage only the immutable verified pair
        run: |
          set -euo pipefail
          cd dist/original-verified
          printf '%s\n' 'd3145b1bc8f04c0370db30ff10e87158b6c3c88c0fde68cb0f226d3b73f79baf  Minecraft-Jail-1.2.0.jar' '61f6add6c68364b1c9dda4486948faf8d104c45ca2db2c40199de64a04ea38f7  Unyielding-1.2.0.jar' | sha256sum -c -
          cd ../..
          mkdir -p dist/120-release minecraft-jail/build/libs
          cp dist/original-verified/Unyielding-1.2.0.jar dist/120-release/
          cp dist/original-verified/Minecraft-Jail-1.2.0.jar minecraft-jail/build/libs/
          python3 .github/scripts/fetch-build-dependencies.py
          python3 .github/resource-continuation/prepare.py
      - name: Prepare isolated displays on the disposable runner
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 libopenal1 libxrandr2 libxcursor1 libxinerama1
      - name: Refusals, combined resources, blocked deaths and post-release restarts
        run: bash .github/resource-continuation/run.sh '${{ matrix.kind }}'
      - name: Preserve evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jail-continuation-${{ matrix.kind }}-${{ github.sha }}
          path: |
            dist/packaged-smoke/
            dist/packaged-harness/run-server/jail_integrated_smoke/continuation-*.snbt
            dist/packaged-harness/run-server/crash-reports/
          retention-days: 30
          if-no-files-found: error
  native-reference:
    needs: preflight-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        kind: [party, wallet]
    env:
      UQ_ACCESSORY_INTEGRATION: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            unyielding-quests/*.gradle
            unyielding-quests/gradle/wrapper/gradle-wrapper.properties
            combined-unyielding/smoke-harness/*.gradle
      - name: Require production to remain exactly at the verified split
        run: |
          git fetch --no-tags --depth=1 origin 4e3667a149d4e530bddb5326ee739ad386fe6a47
          git diff --exit-code 4e3667a149d4e530bddb5326ee739ad386fe6a47 HEAD -- minecraft-jail unyielding-quests combined-unyielding currency-bridge iv-substitute-update model-hotfix riding-update settings-update tutorial-update
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: minecraft-jail-runtime-verified-4e3667a149d4e530bddb5326ee739ad386fe6a47
          run-id: 43928823842
          github-token: ${{ github.token }}
          path: dist/original-verified/
      - name: Stage only the immutable verified pair
        run: |
          set -euo pipefail
          cd dist/original-verified
          printf '%s\n' 'd3145b1bc8f04c0370db30ff10e87158b6c3c88c0fde68cb0f226d3b73f79baf  Minecraft-Jail-1.2.0.jar' '61f6add6c68364b1c9dda4486948faf8d104c45ca2db2c40199de64a04ea38f7  Unyielding-1.2.0.jar' | sha256sum -c -
          cd ../..
          mkdir -p dist/120-release minecraft-jail/build/libs
          cp dist/original-verified/Unyielding-1.2.0.jar dist/120-release/
          cp dist/original-verified/Minecraft-Jail-1.2.0.jar minecraft-jail/build/libs/
          python3 .github/scripts/fetch-build-dependencies.py
          python3 .github/resource-native/prepare.py
      - name: Prepare isolated displays on the disposable runner
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 libopenal1 libxrandr2 libxcursor1 libxinerama1
      - name: Actual unjailed native death, respawn and restarts
        run: bash .github/resource-native/run.sh '${{ matrix.kind }}'
      - name: Preserve evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jail-native-control-${{ matrix.kind }}-${{ github.sha }}
          path: |
            dist/packaged-smoke/
            dist/packaged-harness/run-server/jail_integrated_smoke/party-wallet-*.snbt
            dist/packaged-harness/run-server/crash-reports/
          retention-days: 30
          if-no-files-found: error
