name: Backpack, wallet and food custody on NeoForge 21.1.249
on:
  workflow_dispatch:
  push:
    branches: [codex/jail-unyielding-249]
    paths: ['minecraft-jail/**', '.github/items249/**', '.github/workflows/jail-items249.yml']
permissions:
  contents: read
  actions: read
jobs:
  custody:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[items-probe]') || contains(github.event.head_commit.message, '[items-release]')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      UQ_ACCESSORY_INTEGRATION: '1'
      JDK_JAVA_OPTIONS: -Duq.items249=true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: jail-production-build-7b2f6b34412403b0839f1be9b82e136d1d893b20
          run-id: 44099299150
          github-token: ${{ github.token }}
          path: baseline
      - name: Build and test the production candidate
        run: |
          set -euo pipefail
          python3 .github/scripts/fetch-build-dependencies.py
          mkdir -p minecraft-jail/libs dist/120-release
          cp unyielding-quests/libs/{cobblemon,kotlin-stdlib}.jar minecraft-jail/libs/
          cp baseline/dist/production-candidate/Unyielding-1.2.0.jar dist/120-release/
          (cd minecraft-jail && sh gradlew --no-daemon --console=plain clean test jar)
          cp minecraft-jail/build/libs/Minecraft-Jail-1.3.0-beta.3.jar minecraft-jail/build/libs/Minecraft-Jail-1.2.0.jar
      - name: Prepare the stock providers and a disposable two-player world
        run: |
          python3 .github/items249/prepare.py
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 libopenal1 libxrandr2 libxcursor1 libxinerama1
      - name: Admit, escape, restart and release
        run: bash .github/items249/run.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: items249-results-${{ github.sha }}
          path: |
            dist/packaged-smoke/
            minecraft-jail/build/libs/Minecraft-Jail-1.3.0-beta.3.jar
            minecraft-jail/build/test-results/
          retention-days: 14
