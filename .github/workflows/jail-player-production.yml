name: Jail production player-only candidate
on:
  push:
    branches: [codex/jail-player-only-autorespawn]
    paths: ['minecraft-jail/**', '.github/jail-production/**', '.github/workflows/jail-player-production.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: jail-production-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: minecraft-jail/*.gradle
      - name: Assert authorized scope and retain previous work
        run: |
          git fetch --no-tags --depth=1 origin 36816aff5d96ab87a97f5285a41288c5f46e040f
          python3 - <<'PY'
          import subprocess
          paths=subprocess.check_output(['git','diff','--name-only','36816aff5d96ab87a97f5285a41288c5f46e040f','HEAD'],text=True).splitlines()
          assert paths and all(p.startswith(('minecraft-jail/','.github/jail-production/','.github/workflows/jail-player-production.yml','docs/JAIL-PRODUCTION-')) for p in paths),paths
          print('\n'.join(paths))
          PY
          git diff --check 36816aff5d96ab87a97f5285a41288c5f46e040f HEAD
          python3 -m py_compile .github/jail-production/*.py
          bash -n .github/jail-production/run.sh
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: packed-wallet-verified-8e9716d94a932fe5110ae84abdc90adfe0017974
          run-id: 43991171187
          github-token: ${{ github.token }}
          path: dist/original-verified/
      - name: Build actual production Jail and run its complete unit suite
        run: |
          set -euo pipefail
          python3 .github/scripts/fetch-build-dependencies.py
          mkdir -p minecraft-jail/libs dist/production-build
          cp unyielding-quests/libs/cobblemon.jar unyielding-quests/libs/kotlin-stdlib.jar minecraft-jail/libs/
          (cd minecraft-jail && sh gradlew --no-daemon --console=plain clean test jar) 2>&1 | tee dist/production-build/gradle.log
          python3 -m unittest discover -s .github/scripts -p 'test_companion_certificate.py' -v 2>&1 | tee dist/production-build/certificate-tests.txt
          python3 -m unittest discover -s .github/scripts -p 'test_jail_loader_metadata.py' -v 2>&1 | tee dist/production-build/metadata-tests.txt
          python3 -m unittest discover -s .github/scripts -p 'test_jail_split.py' -v 2>&1 | tee dist/production-build/split-tests.txt
          python3 .github/jail-production/package.py
      - name: Preserve exact production source and unit evidence
        if: always()
        run: |
          mkdir -p dist/production-build
          git archive --format=zip -o dist/production-build/source.zip HEAD minecraft-jail .github/jail-production .github/workflows/jail-player-production.yml
          git rev-parse HEAD > dist/production-build/commit.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: jail-production-build-${{ github.sha }}
          path: |
            dist/production-build/
            dist/production-candidate/
            minecraft-jail/build/test-results/
          if-no-files-found: error
          retention-days: 30
  runtime:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        slice: [player, integrated, startup-terrain]
    env:
      UQ_ACCESSORY_INTEGRATION: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            minecraft-jail/*.gradle
            combined-unyielding/smoke-harness/*.gradle
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: jail-production-build-${{ github.sha }}
          path: candidate/
      - name: Load the exact compiled candidate and unchanged companion
        run: |
          set -euo pipefail
          src=candidate/dist/production-candidate
          (cd "$src" && sha256sum -c SHA256SUMS)
          mkdir -p dist/120-release minecraft-jail/build/libs
          cp "$src/Unyielding-1.2.0.jar" dist/120-release/
          cp "$src/Minecraft-Jail-1.2.0.jar" minecraft-jail/build/libs/
          python3 .github/scripts/fetch-build-dependencies.py
          if [ '${{ matrix.slice }}' = player ]; then python3 .github/jail-production/prepare.py; else python3 .github/scripts/prepare-split-server.py; fi
      - name: Prepare disposable client displays
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 libopenal1 libxrandr2 libxcursor1 libxinerama1
      - name: Verify real player lifecycle and original regressions
        run: |
          if [ '${{ matrix.slice }}' = player ]; then bash .github/jail-production/run.sh; else bash .github/scripts/run-split-runtime.sh '${{ matrix.slice }}'; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: jail-production-runtime-${{ matrix.slice }}-${{ github.sha }}
          path: |
            dist/packaged-smoke/
            dist/packaged-harness/src/
            dist/packaged-harness/run-server/crash-reports/
            dist/packaged-harness/run/crash-reports/
            dist/packaged-harness/run-visitor/crash-reports/
          if-no-files-found: error
          retention-days: 30
  verified:
    needs: [build, runtime]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: jail-production-*-${{ github.sha }}
          path: evidence/
      - name: Bind actual runtime results to exact candidate bytes and source
        run: python3 .github/jail-production/final.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jail-production-verified-${{ github.sha }}
          path: dist/verified-production/
          if-no-files-found: error
          retention-days: 30
