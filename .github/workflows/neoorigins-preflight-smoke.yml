name: NeoOrigins read-only preflight smoke
on:
  workflow_dispatch:
  push:
    branches: ['codex/recovery-review-safe']
permissions:
  contents: read
jobs:
  real-api:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare verified public dependencies
        run: |
          python3 .github/scripts/fetch-build-dependencies.py
          for d in run-server run run-visitor; do mkdir -p "unyielding-quests/$d/mods"; done
          curl --fail --location --retry 3 'https://cdn.modrinth.com/data/RUtQ9kfe/versions/o7CeCqhv/neoorigins-2.2.27%2B1.21.1.jar' -o unyielding-quests/run-server/mods/neoorigins.jar
          echo 'a7273acc69ee7b573223fc3073520e9877ca0c91181a7c2c52827e6fa4ad0b894c96f781f02079cce93e6fca080f7c71d9623b68b223ed0546894403048f37d7  unyielding-quests/run-server/mods/neoorigins.jar' | sha512sum -c -
          cp unyielding-quests/run-server/mods/neoorigins.jar unyielding-quests/run/mods/
          cp unyielding-quests/run-server/mods/neoorigins.jar unyielding-quests/run-visitor/mods/
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 libopenal1 libxrandr2 libxcursor1 libxinerama1
      - name: Exercise read-only preflight on a connected player
        env:
          UQ_RESULT_FILE: /tmp/uq-neoorigins-preflight-result
          JAVA_TOOL_OPTIONS: -Duq.neoOriginsPreflight=true
          LIBGL_ALWAYS_SOFTWARE: 'true'
          ALSOFT_DRIVERS: 'null'
        run: bash .github/scripts/meeting-two-player.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: neoorigins-preflight-logs
          path: meeting-two-player-logs/
          if-no-files-found: warn
