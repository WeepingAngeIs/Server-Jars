name: Apply reviewed packed-wallet increment
on:
  push:
    branches: ['codex/jail-standalone-extraction']
    paths: ['.github/workflows/jail-wallet-apply.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 10
      - name: Validate exact patch and preserved source before applying
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 9fc1f509000254a81ac3d6fc79a1dac4f51d323e HEAD
          python3 - <<'PY'
          import base64,gzip,hashlib,os,subprocess
          from pathlib import Path
          base='9fc1f509000254a81ac3d6fc79a1dac4f51d323e'
          staged=set(subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines())
          assert staged=={'.github/workflows/jail-wallet-apply.yml',*(f'.github/wallet-patch/part{i}' for i in range(3))},staged
          encoded=''.join(Path(f'.github/wallet-patch/part{i}').read_text().strip() for i in range(3))
          patch=gzip.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(patch).hexdigest()=='39a543a1b70116a58d649364aff73550586a7423bc6b6423f5416f5c117c37b6'
          path=Path(os.environ['RUNNER_TEMP'])/'wallet.patch';path.write_bytes(patch)
          subprocess.run(['git','apply','--check',str(path)],check=True)
          subprocess.run(['git','apply',str(path)],check=True)
          PY
      - name: Preserve history and commit only the reviewed increment
        run: |
          set -euo pipefail
          git add minecraft-jail/src/main/java/dev/unyielding/jail/ minecraft-jail/src/test/java/dev/unyielding/jail/PackedWalletPolicyTest.java .github/packed-wallet/ .github/scripts/verify-jail-source.py .github/workflows/jail-packed-wallet.yml docs/JAIL-PACKED-WALLET-IMPLEMENTATION.md
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Implement bounded packed-wallet exact-slot custody and actual restart/fault tests; keep other wallets and Pokemon blocked'
          git push origin HEAD:refs/heads/codex/jail-standalone-extraction
