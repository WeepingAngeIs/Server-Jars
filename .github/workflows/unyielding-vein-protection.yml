name: Jail-free vein protection and displays
on:
  workflow_dispatch:
  push:
    branches: ['codex/unyielding-jail-free-followup']
    paths:
      - '.github/vein-protection/**'
      - '.github/scripts/prepare-vein-protection.py'
      - '.github/scripts/vein-protection.sh'
      - '.github/workflows/unyielding-vein-protection.yml'
      - 'unyielding-quests/src/main/java/dev/unyielding/quests/ultimine/**'
      - 'unyielding-quests/src/main/java/dev/unyielding/quests/client/UltimineClient.java'
permissions:
  contents: read
jobs:
  protection:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: unyielding-quests/*.gradle
      - name: Verify standalone Jail stays unchanged
        run: test "$(git rev-parse HEAD:minecraft-jail)" = a076432b535ebd230fe8ab0681a93ae85e786a69
      - name: Build Unyielding and run unit tests
        run: |
          python3 .github/scripts/fetch-build-dependencies.py
          chmod +x unyielding-quests/gradlew
          cd unyielding-quests
          ./gradlew --no-daemon --console=plain build
      - name: Assemble jail-free candidate
        run: python3 .github/scripts/assemble-118-followup.py
      - name: Prepare actual OPAC and two-client fixture
        run: |
          python3 .github/scripts/prepare-vein-protection.py
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 libopenal1 libxrandr2 libxcursor1 libxinerama1
      - name: Verify allowed and denied actions and capture displays
        env:
          LIBGL_ALWAYS_SOFTWARE: 'true'
          ALSOFT_DRIVERS: 'null'
        run: bash .github/scripts/vein-protection.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: unyielding-vein-protection
          path: |
            dist/120-release/
            dist/vein-protection/
            unyielding-quests/build/test-results/test/
