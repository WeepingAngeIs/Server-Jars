name: OPAC meeting claim smoke
on:
  workflow_dispatch:
  push:
    branches: ['codex/recovery-review-safe']
permissions:
  contents: read
jobs:
  opac-033:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - run: python3 .github/scripts/fetch-build-dependencies.py
      - name: Download verified public OPAC 0.33.0
        run: |
          mkdir -p unyielding-quests/run-server/mods
          curl --fail --location --retry 3 'https://cdn.modrinth.com/data/gF3BGWvG/versions/yWmXD7GW/open-parties-and-claims-neoforge-1.21.1-0.33.0.jar' -o unyielding-quests/run-server/mods/opac.jar
          echo '646fd9796ef2dfd1132e22aacf1a417639233d90fb7eb862a718badfed955d54714c88327b7ddc651f98cd5b7d2a80e8c91233d2232680d4998fdd10ef392ffb  unyielding-quests/run-server/mods/opac.jar' | sha512sum -c -
      - name: Check real OPAC claims in disposable server
        working-directory: unyielding-quests
        run: |
          printf 'eula=true\n' > run-server/eula.txt
          printf 'online-mode=false\nview-distance=3\nsimulation-distance=3\nmax-tick-time=-1\n' > run-server/server.properties
          chmod +x gradlew
          timeout 600s ./gradlew --no-daemon --console=plain -Duq.groundSmoke=true -Duq.opacSmoke=true runServer
          result=$(find . -name ground-smoke-result.txt -print -quit)
          test -n "$result"
          cat "$result"
          grep -q '^passed:' "$result"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: opac-meeting-smoke-logs
          path: unyielding-quests/run-server/logs/
          if-no-files-found: ignore
