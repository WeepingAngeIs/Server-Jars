name: Build and verify Unyielding currency update

on:
  push:
    branches: [feature/currency-bridge]
    paths:
      - 'currency-bridge/**'
      - 'combined-unyielding/**'
      - '.github/workflows/build-currency-bundle.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unyielding-currency-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out pinned inputs and cloud harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          sparse-checkout: |
            currency-bridge
            combined-unyielding
            unyielding-quests
            releases
            .github
      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            unyielding-quests/gradle/wrapper/gradle-wrapper.properties
            combined-unyielding/smoke-harness/*.gradle
      - name: Compile the currency parser compatibility fix
        run: python3 currency-bridge/compile_patch.py
      - name: Assemble and audit finished input JARs
        run: python3 currency-bridge/build_bundle.py
      - name: Prepare isolated final-JAR checks
        run: |
          chmod +x unyielding-quests/gradlew
          python3 currency-bridge/prepare_smoke.py
      - name: Install cloud display dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 libopenal1 libxrandr2 libxcursor1 libxinerama1
      - name: Exercise currency integration in actual server and client
        run: bash currency-bridge/run_smoke.generated.sh
      - name: Upload verified release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Unyielding-1.1.1-verified
          path: dist/currency/
          if-no-files-found: error
          retention-days: 90
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Unyielding-1.1.1-test-evidence
          path: |
            dist/currency-smoke/
            dist/currency/assembly-report.json
          if-no-files-found: warn
          retention-days: 90
