name: Assembled protected custody interface and quarantine
on:
  workflow_dispatch:
  push:
    branches: ['codex/recovery-review-safe']
permissions:
  contents: read
jobs:
  custody-interface:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      UQ_ACCESSORY_INTEGRATION: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            unyielding-quests/*.gradle
            unyielding-quests/gradle.properties
            unyielding-quests/gradle/wrapper/gradle-wrapper.properties
      - name: Fetch pinned build dependencies
        run: python3 .github/scripts/fetch-build-dependencies.py
      - name: Build component and transaction policy tests
        working-directory: unyielding-quests
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain build
      - name: Assemble final JAR and verify class closure
        run: |
          python3 -m unittest discover -s .github/scripts -p test_class_dependencies.py -v
          python3 .github/scripts/assemble-118-followup.py
      - name: Prepare unchanged final-JAR harness and pinned native origin runtime
        run: |
          python3 .github/scripts/prepare-packaged-server.py
          python3 .github/scripts/install-origin-test-runtime.py
      - name: Prepare isolated client displays
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 libopenal1 libxrandr2 libxcursor1 libxinerama1
      - name: Protected custody menus quarantine and native recovery through two restarts
        env:
          UQ_PACKAGED_JAIL_SMOKE: '1'
          UQ_WORLD_NAME: jail_interface_smoke
          UQ_RESULT_FILE: /tmp/uq-interface-result
          LIBGL_ALWAYS_SOFTWARE: 'true'
          ALSOFT_DRIVERS: 'null'
        run: |
          for phase in 1 2 3; do
            export JAVA_TOOL_OPTIONS="-Duq.custodyInterface=true -Duq.interfacePhase=$phase"
            bash .github/scripts/meeting-two-player.sh
            cp -a dist/packaged-smoke/jail-player-logs "dist/packaged-smoke/interface-phase$phase"
          done
      - name: Upload protected custody evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: assembled-custody-interface-evidence
          path: |
            dist/packaged-smoke/
            unyielding-quests/build/test-results/
          if-no-files-found: warn

