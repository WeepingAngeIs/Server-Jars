name: Ground cleanup isolated server smoke
on:
  workflow_dispatch:
  push:
    branches: ['codex/unyielding-improvements-wip']
permissions:
  contents: read
jobs:
  isolated-server:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            unyielding-quests/*.gradle
            unyielding-quests/gradle.properties
            unyielding-quests/gradle/wrapper/gradle-wrapper.properties
      - name: Fetch verified compile dependencies
        run: python3 .github/scripts/fetch-build-dependencies.py
      - name: Run cleanup in a disposable local test world
        working-directory: unyielding-quests
        run: |
          mkdir -p run-server
          printf 'eula=true\n' > run-server/eula.txt
          printf 'online-mode=false\nview-distance=3\nsimulation-distance=3\nmax-tick-time=-1\n' > run-server/server.properties
          chmod +x gradlew
          timeout 600s ./gradlew --no-daemon --console=plain -Duq.groundSmoke=true runServer
          result=$(find . -name ground-smoke-result.txt -print -quit)
          test -n "$result"
          cat "$result"
          grep -q '^passed:' "$result"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ground-cleanup-smoke-logs
          path: |
            unyielding-quests/run-server/logs/
            unyielding-quests/run-server/ground-smoke-result.txt
            unyielding-quests/ground-smoke-result.txt
          if-no-files-found: ignore
