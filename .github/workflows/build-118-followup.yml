name: Build Unyielding 1.2.0 update

on:
  workflow_dispatch:
  push:
    branches: ['codex/unyielding-118-followup', 'codex/unyielding-improvements-wip', 'codex/recovery-review-safe']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            unyielding-quests/*.gradle
            unyielding-quests/gradle.properties
            unyielding-quests/gradle/wrapper/gradle-wrapper.properties
      - name: Fetch verified compile dependencies
        run: python3 .github/scripts/fetch-build-dependencies.py
      - name: Build quest component and run tests
        working-directory: unyielding-quests
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain build
      - name: Test packaged class dependency checks
        run: python3 -m unittest discover -s .github/scripts -p test_class_dependencies.py -v
      - name: Assemble verified release
        run: python3 .github/scripts/assemble-118-followup.py
      - name: Prepare independent assembled-JAR server
        run: python3 .github/scripts/prepare-packaged-server.py
      - name: Start and restart disposable world using assembled JAR
        run: bash .github/scripts/packaged-server-smoke.sh
      - name: Install isolated client display dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 libopenal1 libxrandr2 libxcursor1 libxinerama1
      - name: Exercise packaged jail with two real players and restart
        env:
          UQ_PACKAGED_JAIL_SMOKE: '1'
          UQ_RESULT_FILE: /tmp/uq-jail-player-result
          LIBGL_ALWAYS_SOFTWARE: 'true'
          ALSOFT_DRIVERS: 'null'
        run: |
          export JAVA_TOOL_OPTIONS='-Duq.jailPlayers=true -Duq.jailPhase=1'
          bash .github/scripts/meeting-two-player.sh
          cp /tmp/uq-jail-player-result /tmp/uq-packaged-jail-phase1
          export JAVA_TOOL_OPTIONS='-Duq.jailPlayers=true -Duq.jailPhase=2'
          bash .github/scripts/meeting-two-player.sh
          cat /tmp/uq-packaged-jail-phase1 /tmp/uq-jail-player-result
      - name: Upload build and checksums
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Unyielding-1.2.0-update
          path: dist/120-release/
          if-no-files-found: error
      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Unyielding-1.2.0-update-reports
          path: |
            unyielding-quests/build/reports/
            unyielding-quests/build/test-results/
            dist/packaged-smoke/
          if-no-files-found: warn
