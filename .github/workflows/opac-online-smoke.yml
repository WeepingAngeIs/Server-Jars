name: OPAC connected player smoke
on:
  workflow_dispatch:
  push:
    branches: ['codex/recovery-review-safe']
permissions:
  contents: read
jobs:
  connected-player:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Fetch dependencies and OPAC
        run: |
          python3 .github/scripts/fetch-build-dependencies.py
          mkdir -p unyielding-quests/run-server/mods unyielding-quests/run/mods
          curl --fail --location --retry 3 'https://cdn.modrinth.com/data/gF3BGWvG/versions/yWmXD7GW/open-parties-and-claims-neoforge-1.21.1-0.33.0.jar' -o unyielding-quests/run-server/mods/opac.jar
          echo '646fd9796ef2dfd1132e22aacf1a417639233d90fb7eb862a718badfed955d54714c88327b7ddc651f98cd5b7d2a80e8c91233d2232680d4998fdd10ef392ffb  unyielding-quests/run-server/mods/opac.jar' | sha512sum -c -
          cp unyielding-quests/run-server/mods/opac.jar unyielding-quests/run/mods/opac.jar
      - name: Install display dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 libopenal1 libxrandr2 libxcursor1 libxinerama1
      - name: Test connected player with real OPAC
        env:
          JAVA_TOOL_OPTIONS: -Duq.opacOnline=true
        run: |
          rm -f /tmp/uq-opac-online-result
          bash .github/scripts/tutorial-smoke.sh
          cat /tmp/uq-opac-online-result
          grep -q '^passed:' /tmp/uq-opac-online-result
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: opac-online-smoke-evidence
          path: tutorial-smoke/
          if-no-files-found: warn
