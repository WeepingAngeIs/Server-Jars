name: Jail occupied artifact transition
on:
  push:
    branches: [codex/jail-occupied-migration-validation]
    paths: ['minecraft-jail/**', '.github/occupied-migration/**', '.github/workflows/jail-occupied-migration.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: jail-occupied-migration-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: minecraft-jail/*.gradle
      - name: Preserve scope and history
        run: |
          git fetch --no-tags --depth=1 origin 9062a95bc8742ab10a0db21f05ef3b2b97512525
          python3 - <<'PY'
          import subprocess
          rows=subprocess.check_output(['git','diff','--name-only','9062a95bc8742ab10a0db21f05ef3b2b97512525','HEAD'],text=True).splitlines()
          assert rows and all(p.startswith(('minecraft-jail/','.github/occupied-migration/','.github/workflows/jail-occupied-migration.yml','docs/JAIL-OCCUPIED-')) for p in rows),rows
          PY
          git diff --check 9062a95bc8742ab10a0db21f05ef3b2b97512525 HEAD
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: jail-production-build-7b2f6b34412403b0839f1be9b82e136d1d893b20
          run-id: 44099299150
          github-token: ${{ github.token }}
          path: old-evidence/
      - name: Compile real production candidate and run units
        run: |
          set -euo pipefail
          mkdir -p dist/migration-build
          python3 .github/scripts/fetch-build-dependencies.py
          mkdir -p minecraft-jail/libs
          cp unyielding-quests/libs/cobblemon.jar unyielding-quests/libs/kotlin-stdlib.jar minecraft-jail/libs/
          (cd minecraft-jail && sh gradlew --no-daemon --console=plain clean test jar) 2>&1 | tee dist/migration-build/gradle.log
      - name: Preserve candidate and source even on failure; no migration pass implied
        if: always()
        run: |
          mkdir -p dist/migration-build
          git archive --format=zip -o dist/migration-build/source.zip HEAD minecraft-jail .github/workflows/jail-occupied-migration.yml
          git rev-parse HEAD > dist/migration-build/commit.txt
          cp minecraft-jail/build/libs/*.jar dist/migration-build/ 2>/dev/null || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: jail-migration-build-${{ github.sha }}
          path: |
            dist/migration-build/
            minecraft-jail/build/test-results/
          if-no-files-found: error
          retention-days: 30

  runtime:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      UQ_ACCESSORY_INTEGRATION: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: jail-migration-build-${{ github.sha }}
          path: candidate/
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: jail-production-build-7b2f6b34412403b0839f1be9b82e136d1d893b20
          run-id: 44099299150
          github-token: ${{ github.token }}
          path: old-evidence/
      - name: Prepare disposable exact-artifact runtime and unchanged companion
        run: |
          set -euo pipefail
          mkdir -p dist/120-release minecraft-jail/build/libs
          cp old-evidence/dist/production-candidate/Unyielding-1.2.0.jar dist/120-release/
          cp candidate/dist/migration-build/Minecraft-Jail-1.2.0.jar minecraft-jail/build/libs/
          python3 .github/scripts/fetch-build-dependencies.py
          python3 .github/occupied-migration/prepare.py
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 libopenal1 libxrandr2 libxcursor1 libxinerama1
      - name: Exact predecessor occupied save, interruptions, tampering, restart, native escape and return
        run: bash .github/occupied-migration/run.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: jail-occupied-runtime-${{ github.sha }}
          path: |
            dist/packaged-smoke/
            dist/packaged-harness/src/
          if-no-files-found: error
          retention-days: 30
