name: Build and verify Unyielding custom Pokemon update

on:
  push:
    branches: [feature/custom-pokemon-riding]
    paths:
      - 'riding-update/**'
      - '.github/workflows/build-riding-update.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unyielding-riding-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Check out pinned release and regression harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          sparse-checkout: |
            riding-update
            tutorial-update
            unyielding-quests
            currency-bridge
            combined-unyielding
            releases
            .github
      - name: Set up Java 21 on GitHub
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up verified Gradle distribution
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '8.14.3'
          cache-read-only: false
      - name: Assemble and audit combined JAR
        run: python3 riding-update/build_bundle.py
      - name: Prepare isolated final-JAR checks
        run: python3 riding-update/prepare_smoke.py
      - name: Install cloud display dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 libopenal1 libxrandr2 libxcursor1 libxinerama1
          chmod +x unyielding-quests/gradlew
      - name: Exercise combined JAR in real server and client
        run: bash riding-update/run_smoke.generated.sh
      - name: Upload verified release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Unyielding-1.1.7-verified
          path: dist/riding/
          if-no-files-found: error
          retention-days: 90
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Unyielding-1.1.7-test-evidence
          path: |
            dist/riding-smoke/
            dist/riding/assembly-report.json
          if-no-files-found: warn
          retention-days: 90
