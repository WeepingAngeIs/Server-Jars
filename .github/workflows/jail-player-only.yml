name: Jail player-only automatic respawn
on:
  push:
    branches: [codex/jail-player-only-autorespawn]
    paths: ['.github/player-only/**', '.github/workflows/jail-player-only.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: jail-player-only-${{ github.ref }}
  cancel-in-progress: false
jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      UQ_ACCESSORY_INTEGRATION: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            unyielding-quests/*.gradle
            unyielding-quests/gradle/wrapper/gradle-wrapper.properties
            minecraft-jail/*.gradle
            combined-unyielding/smoke-harness/*.gradle
      - name: Verify isolated scope and preserve all earlier work
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin 5948ccabbfc24f81e620f7e3504e0906e4a50108
          python3 - <<'PY'
          import subprocess
          changed=subprocess.check_output(['git','diff','--name-only','5948ccabbfc24f81e620f7e3504e0906e4a50108','HEAD'],text=True).splitlines()
          assert changed and all(p.startswith(('.github/player-only/','.github/workflows/jail-player-only.yml','docs/JAIL-PLAYER-ONLY-')) for p in changed),changed
          print('\n'.join(changed))
          PY
          git diff --check 5948ccabbfc24f81e620f7e3504e0906e4a50108 HEAD
          python3 -m py_compile .github/player-only/*.py
          bash -n .github/player-only/run.sh
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: packed-wallet-verified-8e9716d94a932fe5110ae84abdc90adfe0017974
          run-id: 43991171187
          github-token: ${{ github.token }}
          path: dist/original-verified/
      - name: Prepare unchanged exact JAR pair and test-only behavior
        run: |
          set -euo pipefail
          cd dist/original-verified
          printf '%s\n' '5c2653a9c14d3199581fdd67e05d055b334ec2746fe7047e3c80454eb732474e  Minecraft-Jail-1.2.0.jar' '61f6add6c68364b1c9dda4486948faf8d104c45ca2db2c40199de64a04ea38f7  Unyielding-1.2.0.jar' | sha256sum -c -
          cd ../..
          mkdir -p dist/120-release minecraft-jail/build/libs
          cp dist/original-verified/Unyielding-1.2.0.jar dist/120-release/
          cp dist/original-verified/Minecraft-Jail-1.2.0.jar minecraft-jail/build/libs/
          python3 .github/scripts/fetch-build-dependencies.py
          python3 .github/player-only/prepare.py
      - name: Run existing Jail unit regressions without publishing a JAR
        run: |
          set -euo pipefail
          mkdir -p minecraft-jail/libs
          cp unyielding-quests/libs/cobblemon.jar unyielding-quests/libs/kotlin-stdlib.jar minecraft-jail/libs/
          (cd minecraft-jail && sh gradlew --no-daemon --console=plain test) 2>&1 | tee dist/packaged-smoke/player-only-unit-tests.log
      - name: Prepare disposable real-client displays
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 libopenal1 libxrandr2 libxcursor1 libxinerama1
      - name: Escape death, no-button respawn, real reconnect and custody regressions
        run: bash .github/player-only/run.sh
      - name: Preserve exact source and failed or passing evidence
        if: always()
        run: |
          mkdir -p dist/player-only-source
          git rev-parse HEAD > dist/player-only-source/commit.txt
          git archive --format=zip -o dist/player-only-source/source.zip HEAD .github/player-only .github/workflows/jail-player-only.yml
          if [ -d dist/packaged-harness/src/main/java/dev/unyielding/jail ]; then cp -r dist/packaged-harness/src/main/java/dev/unyielding/jail dist/player-only-source/generated-jail; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: jail-player-only-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: |
            dist/packaged-smoke/
            dist/player-only-source/
            minecraft-jail/build/test-results/
            dist/packaged-harness/run/crash-reports/
            dist/packaged-harness/run-server/crash-reports/
            dist/packaged-harness/run-visitor/crash-reports/
          if-no-files-found: error
          retention-days: 30
  verified:
    needs: runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: jail-player-only-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: evidence/
      - name: Verify exact-commit runtime and unit results, not deployment approval
        run: |
          python3 - <<'PY'
          import json,os,xml.etree.ElementTree as E
          from pathlib import Path
          root=Path('evidence'); reports=list(root.rglob('player-only-verification.json'));assert len(reports)==1
          r=json.loads(reports[0].read_text());assert r['commit']==os.environ['GITHUB_SHA'] and r['server_starts']==3 and r['verified_automatic_respawns']==2 and r['client_respawn_requests']==0
          assert r['test_mod_only'] and not r['production_changed'] and not r['pokemon_custody_installed']
          suites=[E.parse(p).getroot() for p in root.rglob('TEST-*.xml')];assert suites
          assert all(int(s.get(k,'0'))==0 for s in suites for k in ('failures','errors','skipped'))
          r['jail_unit_tests']=sum(int(s.get('tests','0')) for s in suites);assert r['jail_unit_tests']>=65
          Path('player-only-final.json').write_text(json.dumps(r,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jail-player-only-verified-${{ github.sha }}
          path: player-only-final.json
          if-no-files-found: error
          retention-days: 30
