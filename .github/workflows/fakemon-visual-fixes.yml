name: Fairy Sliggoo and Inkyeon visual fixes

on:
  push:
    branches: [fix/fairy-sliggoo-inkyeon]
    paths:
      - 'fakemon-fixes/**'
      - '.github/workflows/fakemon-visual-fixes.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fakemon-visual-fixes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          sparse-checkout: |
            releases/Unyielding-1.1.7.jar
            fakemon-fixes
            .github/workflows/fakemon-visual-fixes.yml
          sparse-checkout-cone-mode: false
      - name: Extract verified Cobblemon 1.8.4 Sliggoo reference
        shell: python
        run: |
          import hashlib, io, json, pathlib, urllib.request, zipfile
          headers = {'User-Agent': 'Unyielding-Fakemon-Visual-Fixes/1.0'}
          def get(url):
              with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=180) as response:
                  return response.read()
          info = json.loads(get('https://api.modrinth.com/v2/version/xsVHrAsY'))
          assert info['id'] == 'xsVHrAsY'
          selected = next(f for f in info['files'] if f.get('primary'))
          raw = get(selected['url'])
          assert hashlib.sha512(raw).hexdigest() == selected['hashes']['sha512']
          out = pathlib.Path('dist/fakemon-reference')
          out.mkdir(parents=True, exist_ok=True)
          paths = []
          with zipfile.ZipFile(io.BytesIO(raw)) as archive:
              for name in archive.namelist():
                  if not name.endswith('/') and ('sliggoo' in name.lower() or 'license' in name.lower() or 'credits' in name.lower()):
                      assert not name.startswith('/') and '..' not in pathlib.PurePosixPath(name).parts
                      target = out / name
                      target.parent.mkdir(parents=True, exist_ok=True)
                      target.write_bytes(archive.read(name))
                      paths.append(name)
          (out / 'reference.json').write_text(json.dumps({'version_id': info['id'], 'filename': selected['filename'], 'url': selected['url'], 'sha512': selected['hashes']['sha512'], 'paths': paths}, indent=2) + '\n')
          print('\n'.join(paths))
      - name: Upload original Sliggoo reference for inspection
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sliggoo-1.8.4-reference
          path: dist/fakemon-reference/
          retention-days: 30
      - name: Apply and verify the narrowly scoped asset patch
        if: hashFiles('fakemon-fixes/patch.py') != ''
        run: |
          python3 -m pip install --disable-pip-version-check Pillow==11.3.0
          python3 fakemon-fixes/patch.py --input releases/Unyielding-1.1.7.jar --reference dist/fakemon-reference --output releases/fairy-sliggoo-inkyeon/Unyielding-1.1.7.jar
      - name: Upload patched JAR and verification report
        if: hashFiles('fakemon-fixes/patch.py') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Unyielding-1.1.7-fakemon-visual-fixes
          path: releases/fairy-sliggoo-inkyeon/
          if-no-files-found: error
          retention-days: 90
      - name: Save verified build on the fix branch only
        if: hashFiles('fakemon-fixes/patch.py') != ''
        env:
          FIX_BRANCH: fix/fairy-sliggoo-inkyeon
        run: |
          test "$GITHUB_REF_NAME" = "$FIX_BRANCH"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse -- releases/fairy-sliggoo-inkyeon
          if ! git diff --cached --quiet; then
            git commit -m 'Save verified Fairy Sliggoo and Inkyeon asset-only build [skip ci]'
            git push origin "HEAD:refs/heads/$FIX_BRANCH"
          fi
