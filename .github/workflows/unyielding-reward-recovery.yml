name: Jail-free Unyielding reward recovery
on:
  workflow_dispatch:
  push:
    branches: ['codex/unyielding-jail-free-followup']
permissions:
  contents: read
jobs:
  recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: unyielding-quests/*.gradle
      - name: Verify standalone Jail source is unchanged
        run: |
          test "$(git rev-parse HEAD:minecraft-jail)" = a076432b535ebd230fe8ab0681a93ae85e786a69
      - name: Fetch verified compile dependencies
        run: python3 .github/scripts/fetch-build-dependencies.py
      - name: Build Unyielding and run unit tests
        working-directory: unyielding-quests
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain build
      - name: Assemble jail-free candidate preserving non-jail baseline entries
        run: python3 .github/scripts/assemble-118-followup.py
      - name: Prepare independent candidate-JAR recovery server
        run: python3 .github/scripts/prepare-reward-server.py
      - name: Exercise legacy saves, failed balance save, resets and five real restarts
        run: bash .github/scripts/reward-server-smoke.sh
      - name: Upload candidate and recovery evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unyielding-reward-recovery
          path: |
            dist/120-release/
            dist/reward-recovery/
            unyielding-quests/build/test-results/test/
