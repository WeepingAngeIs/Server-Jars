name: Jail party wallet source review
on:
  push:
    branches: ['codex/jail-standalone-extraction']
    paths: ['.github/workflows/jail-party-wallet-source.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Export tracked investigation source only and verify production preservation
        run: |
          set -euo pipefail
          mkdir -p /tmp/jail-review
          git fetch --no-tags --depth=1 origin 4e3667a149d4e530bddb5326ee739ad386fe6a47
          git diff --exit-code 4e3667a149d4e530bddb5326ee739ad386fe6a47 HEAD -- minecraft-jail unyielding-quests combined-unyielding currency-bridge iv-substitute-update model-hotfix riding-update settings-update tutorial-update ci-inputs
          git rev-parse HEAD > /tmp/jail-review/commit.txt
          git diff --name-status 4e3667a149d4e530bddb5326ee739ad386fe6a47 HEAD > /tmp/jail-review/changed-files.txt
          git archive --format=zip HEAD .github/party-wallet .github/resource-native .github/workflows/jail-party-wallet.yml .github/workflows/jail-native-resource.yml tools/jail-sandbox docs/JAIL-PARTY-WALLET-RESEARCH.md > /tmp/jail-review/investigation-source.zip
          python3 -m unittest discover -s tools/jail-sandbox -p 'test_*.py' -v 2>&1 | tee /tmp/jail-review/preflight-tests.txt
          printf '%s\n' 'Production source trees and certificates equal verified split 4e3667a149d4e530bddb5326ee739ad386fe6a47. No production build performed.' > /tmp/jail-review/production-preservation.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jail-investigation-source-${{ github.sha }}
          path: /tmp/jail-review/
          retention-days: 30
          if-no-files-found: error
