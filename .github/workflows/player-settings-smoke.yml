name: Player and settings isolated client smoke
on:
  workflow_dispatch:
  push:
    branches: ['codex/unyielding-improvements-wip']
permissions:
  contents: read
jobs:
  client-server:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            unyielding-quests/*.gradle
            unyielding-quests/gradle.properties
            unyielding-quests/gradle/wrapper/gradle-wrapper.properties
      - name: Fetch verified dependencies
        run: python3 .github/scripts/fetch-build-dependencies.py
      - name: Install isolated display dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 libopenal1 libxrandr2 libxcursor1 libxinerama1
      - name: Exercise client and server in temporary worlds
        run: bash .github/scripts/tutorial-smoke.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: player-settings-smoke-evidence
          path: tutorial-smoke/
          if-no-files-found: warn
