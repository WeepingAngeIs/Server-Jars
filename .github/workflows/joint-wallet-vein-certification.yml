name: Bounded wallet Jail and current Unyielding joint certification
on:
  workflow_dispatch:
  push:
    branches: ['codex/joint-wallet-vein-certification']
    paths: ['.github/joint-certification/**', '.github/workflows/joint-wallet-vein-certification.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: joint-wallet-vein-${{ github.ref }}
  cancel-in-progress: false
jobs:
  pair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: packed-wallet-verified-8e9716d94a932fe5110ae84abdc90adfe0017974
          run-id: 43991171187
          github-token: ${{ github.token }}
          path: dist/inputs/wallet
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: unyielding-vein-protection
          run-id: 44003918234
          github-token: ${{ github.token }}
          path: dist/inputs/current
      - name: Verify exact checkpoints and extend only one companion pin
        run: python3 .github/joint-certification/certify.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pending-joint-pair-${{ github.sha }}
          path: dist/joint-pair/
  runtime:
    needs: pair
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        slice: [core, faults, integrated, vein]
    env:
      UQ_ACCESSORY_INTEGRATION: '1'
      LIBGL_ALWAYS_SOFTWARE: 'true'
      ALSOFT_DRIVERS: 'null'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: unyielding-quests/*.gradle
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: pending-joint-pair-${{ github.sha }}
          path: dist/joint-pair
      - name: Prepare only the completed pinned wallet fixtures and actual pair
        run: |
          python3 .github/joint-certification/prepare.py '${{ matrix.slice }}'
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 libopenal1 libxrandr2 libxcursor1 libxinerama1
      - name: Verify custody or non-jail regressions with both actual JARs
        run: |
          if [[ '${{ matrix.slice }}' == vein ]]; then
            bash .github/scripts/vein-protection.sh
          else
            cd dist/wallet-runtime-source
            export GITHUB_WORKSPACE="$PWD"
            if [[ '${{ matrix.slice }}' == integrated ]]; then
              bash .github/scripts/run-split-runtime.sh integrated
            else
              bash .github/packed-wallet/run.sh '${{ matrix.slice }}'
            fi
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: joint-${{ matrix.slice }}-${{ github.sha }}
          path: |
            dist/joint-preparation.json
            dist/wallet-runtime-source/dist/packaged-smoke/
            dist/vein-protection/
          if-no-files-found: error
  verified:
    needs: [pair, runtime]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: pending-joint-pair-${{ github.sha }}
          path: dist/joint-pair
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: joint-*-${{ github.sha }}
          path: dist/joint-evidence
      - name: Require complete exact-pair runtime reports
        run: python3 .github/joint-certification/verify.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-joint-pair-${{ github.sha }}
          path: dist/joint-pair/
