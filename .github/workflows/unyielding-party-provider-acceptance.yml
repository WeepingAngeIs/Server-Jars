name: Independent jail-free party meeting provider acceptance
on:
  workflow_dispatch:
  push:
    branches: ['codex/unyielding-party-provider-acceptance']
    paths:
      - '.github/party-provider-acceptance/**'
      - '.github/scripts/prepare-party-provider-acceptance.py'
      - '.github/scripts/party-provider-acceptance.sh'
      - '.github/workflows/unyielding-party-provider-acceptance.yml'
      - 'unyielding-quests/src/main/java/dev/unyielding/quests/essentials/PartyMeetings.java'
      - 'unyielding-quests/src/main/java/dev/unyielding/quests/essentials/PartyMeetingPolicy.java'
      - 'unyielding-quests/src/main/java/dev/unyielding/quests/essentials/PartyMeetingData.java'
      - 'unyielding-quests/src/main/java/dev/unyielding/quests/essentials/MeetingClaims.java'
permissions:
  contents: read
  actions: read
jobs:
  meeting-provider:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: unyielding-quests/*.gradle
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: unyielding-reward-client-acceptance
          run-id: 44024899650
          github-token: ${{ github.token }}
          path: dist/baseline-artifact
      - name: Stage verified reward candidate; build only a reproduced production fix
        run: |
          git fetch --no-tags --depth=1 origin 8b18dda72dd4745ed35381abcbc0a1072a8e13a7
          python3 .github/scripts/fetch-build-dependencies.py
          mkdir -p dist/120-release
          cp dist/baseline-artifact/dist/120-release/Unyielding-1.2.0.jar dist/120-release/
          printf '%s\n' '744be06c8fa5ad6001f1ba214608c4f7c1dde59664afe2bf8bf33405063512d8  dist/120-release/Unyielding-1.2.0.jar' | sha256sum -c -
          if ! git diff --quiet 8b18dda72dd4745ed35381abcbc0a1072a8e13a7 HEAD -- unyielding-quests/src/main .github/scripts/assemble-118-followup.py; then
            (cd unyielding-quests && ./gradlew --no-daemon --console=plain build)
            python3 .github/scripts/assemble-118-followup.py
          fi
      - name: Prepare public OPAC and synthetic permission-provider clients
        run: |
          python3 .github/scripts/prepare-party-provider-acceptance.py
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 libopenal1 libxrandr2 libxcursor1 libxinerama1
      - name: Verify provider denial and meeting lifecycle with real commands
        env:
          LIBGL_ALWAYS_SOFTWARE: 'true'
          ALSOFT_DRIVERS: 'null'
        run: bash .github/scripts/party-provider-acceptance.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: unyielding-party-provider-acceptance
          path: |
            dist/120-release/
            dist/party-provider-acceptance/
            unyielding-quests/build/test-results/test/
          if-no-files-found: error
