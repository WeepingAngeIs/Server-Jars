name: Jail checked mutation source repair
on:
  push:
    branches: [codex/jail-standalone-extraction]
    paths: [.github/workflows/jail-mutation-repair.yml]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - name: Patch exact new test-policy source only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('.github/party-mutation/java/dev/unyielding/jail/party/live/MutationGate.java')
          s=p.read_text();assert hashlib.sha256(s.encode()).hexdigest()=='5530ce6c297046c96470e270fe640c34cfb795dcefcc16ca4b5158768f2ca827'
          needle='"loadFromNBT","loadFrom","saveToNBT","saveTo","removeDuplicates"'
          assert s.count(needle)==1
          s=s.replace(needle,'"loadFromNBT","loadFromJSON","loadFrom","saveToNBT","saveToJSON","saveTo","removeDuplicates"')
          needle='                verifyCurrent(c,source);\n                j.commit(j.receipt(),state(source,origin,custody.receipt(),epoch,Phase.PREPARED'
          assert s.count(needle)==1
          s=s.replace(needle,'                if(epoch>=64)throw new IOException("Publication epoch limit; no implicit reset");\n'+needle)
          assert hashlib.sha256(s.encode()).hexdigest()=='9d481491d292871dd20281dd53b8553d5ec118a56f586797035dd5cb3a4ca26a'
          p.write_text(s)
          print('Verified exact repaired policy SHA256')
          PY
          git diff --check
          test "$(git diff --name-only)" = '.github/party-mutation/java/dev/unyielding/jail/party/live/MutationGate.java'
          actual=$(git ls-remote origin refs/heads/codex/jail-standalone-extraction | cut -f1)
          test "$actual" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/party-mutation/java/dev/unyielding/jail/party/live/MutationGate.java
          git commit -m 'Permit native JSON codec operations only for private constructor-tracked objects; refuse epoch exhaustion before commit'
          git push origin HEAD:refs/heads/codex/jail-standalone-extraction
          mkdir -p dist/mutation-repair
          git rev-parse HEAD > dist/mutation-repair/commit.txt
          git show --format=fuller HEAD > dist/mutation-repair/source.patch
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mutation-repair-${{ github.sha }}
          path: dist/mutation-repair/
          if-no-files-found: error
          retention-days: 30
