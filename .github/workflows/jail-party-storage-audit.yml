name: Inspect pinned Pokemon custody storage boundary
on:
  workflow_dispatch:
  push:
    branches: ['codex/jail-standalone-extraction']
    paths: ['.github/workflows/jail-party-storage-audit.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Fetch and inspect the unchanged pinned dependency
        run: |
          set -euo pipefail
          python3 .github/scripts/fetch-build-dependencies.py
          python3 - <<'PY'
          import hashlib,json,subprocess,zipfile
          from pathlib import Path
          jar=Path('unyielding-quests/libs/cobblemon.jar')
          out=Path('dist/party-storage-audit');out.mkdir(parents=True)
          with zipfile.ZipFile(jar) as z:
              names=sorted(n for n in z.namelist() if n.endswith('.class') and (n.startswith('com/cobblemon/mod/common/api/storage/') or n in ['com/cobblemon/mod/common/api/PrioritizedList.class','com/cobblemon/mod/common/api/Priority.class']))
              extra=[n for n in z.namelist() if n.endswith('.class') and n.startswith('com/cobblemon/mod/common/net/serverhandling/') and any(w in n.lower() for w in ['storage','trade','sendout','release'])]
          (out/'class-index.json').write_text(json.dumps({'storage':names,'mutation_handlers':extra},indent=2))
          for path in names+extra:
              cls=path[:-6].replace('/','.')
              result=subprocess.run(['javap','-p','-c','-s','-classpath',str(jar),cls],check=True,capture_output=True,text=True)
              (out/(cls+'.javap')).write_text(result.stdout)
          (out/'identity.json').write_text(json.dumps({'commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'cobblemon_sha512':hashlib.sha512(jar.read_bytes()).hexdigest(),'bytes':jar.stat().st_size},indent=2))
          subprocess.run(['git','archive','--format=zip','-o',str(out/'current-source.zip'),'HEAD','AGENTS.md','minecraft-jail','.github','docs','tools','combined-unyielding/smoke-harness','unyielding-quests/build.gradle','unyielding-quests/gradle.properties','unyielding-quests/gradle','unyielding-quests/gradlew','unyielding-quests/settings.gradle'],check=True)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jail-party-storage-audit-${{ github.sha }}
          path: dist/party-storage-audit/
          retention-days: 30
          if-no-files-found: error
