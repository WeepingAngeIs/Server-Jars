name: Configtopia optional mod controls
on:
  push:
    branches: [codex/configtopia-optional-controls]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: configtopia-optional-${{ github.ref }}
  cancel-in-progress: true
jobs:
  module:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: unyielding-quests/*.gradle
      - name: Fetch pinned compile dependencies
        run: python3 .github/scripts/fetch-build-dependencies.py
      - name: Compile the current quests module and isolated probe
        working-directory: unyielding-quests
        run: |
          bash gradlew --no-daemon --console=plain -I ../.github/optional-controls/probe.gradle jar optionalControlsProbeJar
          sha256sum build/libs/*.jar
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: configtopia-optional-compiled
          path: unyielding-quests/build/libs/*.jar
          if-no-files-found: error
          retention-days: 7
      - name: Run focused Configtopia unit tests
        working-directory: unyielding-quests
        run: |
          bash gradlew --no-daemon --console=plain test --tests '*ModSettings*' --tests '*NeoForgeSettings*' --tests '*CommandCatalog*' --tests '*ModCommandControls*' --tests '*NumericCommandInput*' --tests '*StoragePlusSettings*' --tests '*WeaponSettingsPresentation*'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: configtopia-optional-unit-results
          path: unyielding-quests/build/test-results/test/
          retention-days: 7
  dedicated:
    if: github.event.repository.private == false
    needs: module
    runs-on: ubuntu-24.04
    timeout-minutes: 38
    strategy:
      fail-fast: false
      matrix:
        mode: [absent, storage]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: configtopia-optional-compiled
          path: dist/optional/module
      - name: Verify optional providers in disposable dedicated server
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/optional-controls/dedicated.py '${{ matrix.mode }}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: configtopia-optional-${{ matrix.mode }}-evidence
          path: dist/optional/evidence/
          if-no-files-found: warn
          retention-days: 7
