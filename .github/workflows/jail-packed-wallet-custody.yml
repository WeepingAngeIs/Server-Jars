name: Bounded packed-wallet custody
on:
  workflow_dispatch:
  push:
    branches: ['codex/jail-packed-wallet-custody']
    paths: ['minecraft-jail/**', '.github/packed-wallet/**', '.github/workflows/jail-packed-wallet-custody.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: packed-wallet-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            minecraft-jail/*.gradle
            unyielding-quests/gradle/wrapper/gradle-wrapper.properties
      - name: Bound changes to the reviewed new Jail contract only
        run: |
          python3 .github/packed-wallet/check_build.py --source-only
          python3 -m unittest discover -s .github/packed-wallet -p test_verify.py -v
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: minecraft-jail-runtime-verified-4e3667a149d4e530bddb5326ee739ad386fe6a47
          run-id: 43928823842
          github-token: ${{ github.token }}
          path: dist/original-verified/
      - name: Build only Jail and run all original and new unit tests
        run: |
          set -euo pipefail
          python3 .github/scripts/fetch-build-dependencies.py
          mkdir -p minecraft-jail/libs
          cp unyielding-quests/libs/cobblemon.jar unyielding-quests/libs/kotlin-stdlib.jar minecraft-jail/libs/
          chmod +x minecraft-jail/gradlew unyielding-quests/gradlew
          (cd minecraft-jail && ./gradlew --no-daemon --console=plain build)
          python3 .github/packed-wallet/check_build.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: packed-wallet-pair-${{ github.sha }}
          path: dist/packed-wallet-pair/
          if-no-files-found: error
          retention-days: 30
      - name: Upload unit-test and build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: packed-wallet-build-${{ github.sha }}
          path: |
            minecraft-jail/build/test-results/
            minecraft-jail/build/reports/
            dist/packed-wallet-pair/build-verification.json
          retention-days: 30
  custody:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        scenario: [lifecycle, occupied, remove-unsaved, remove-saved, return-unsaved, return-saved]
    env:
      UQ_ACCESSORY_INTEGRATION: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            unyielding-quests/*.gradle
            unyielding-quests/gradle/wrapper/gradle-wrapper.properties
            combined-unyielding/smoke-harness/*.gradle
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: packed-wallet-pair-${{ github.sha }}
          path: dist/packed-wallet-pair/
      - name: Prepare actual assembled JARs and independent test mod
        run: |
          set -euo pipefail
          (cd dist/packed-wallet-pair && sha256sum -c SHA256SUMS)
          mkdir -p dist/120-release minecraft-jail/build/libs
          cp dist/packed-wallet-pair/Unyielding-1.2.0.jar dist/120-release/
          cp dist/packed-wallet-pair/Minecraft-Jail-1.2.0.jar minecraft-jail/build/libs/
          python3 .github/scripts/fetch-build-dependencies.py
          python3 .github/packed-wallet/prepare.py
      - name: Prepare isolated native client displays
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 libopenal1 libxrandr2 libxcursor1 libxinerama1
      - name: Actual wallet custody and interrupted-server lifecycle
        run: bash .github/packed-wallet/run.sh '${{ matrix.scenario }}'
      - name: Upload every phase including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: packed-wallet-custody-${{ matrix.scenario }}-${{ github.sha }}
          path: |
            dist/packaged-smoke/
            dist/packaged-harness/build/reports/
            dist/packaged-harness/run-server/crash-reports/
          retention-days: 30
  regression:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        slice: [integrated, retained-xp, certified, startup-terrain]
    env:
      UQ_ACCESSORY_INTEGRATION: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            unyielding-quests/*.gradle
            unyielding-quests/gradle/wrapper/gradle-wrapper.properties
            combined-unyielding/smoke-harness/*.gradle
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: packed-wallet-pair-${{ github.sha }}
          path: dist/packed-wallet-pair/
      - name: Preserve exact companion and run existing split harness against new Jail
        run: |
          set -euo pipefail
          (cd dist/packed-wallet-pair && sha256sum -c SHA256SUMS)
          mkdir -p dist/120-release minecraft-jail/build/libs
          cp dist/packed-wallet-pair/Unyielding-1.2.0.jar dist/120-release/
          cp dist/packed-wallet-pair/Minecraft-Jail-1.2.0.jar minecraft-jail/build/libs/
          python3 .github/scripts/fetch-build-dependencies.py
          python3 .github/scripts/prepare-split-server.py
      - name: Prepare isolated native client displays
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 libopenal1 libxrandr2 libxcursor1 libxinerama1
      - name: Existing native custody, XP, certificate and terrain regressions
        run: bash .github/scripts/run-split-runtime.sh '${{ matrix.slice }}'
      - name: Upload regression evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: packed-wallet-regression-${{ matrix.slice }}-${{ github.sha }}
          path: |
            dist/packaged-smoke/
            dist/packaged-harness/build/reports/
            dist/packaged-harness/run-server/crash-reports/
          retention-days: 30
  verified:
    needs: [build, custody, regression]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: packed-wallet-pair-${{ github.sha }}
          path: dist/packed-wallet-pair/
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: packed-wallet-custody-*-${{ github.sha }}
          path: dist/wallet-evidence/
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: packed-wallet-regression-*-${{ github.sha }}
          path: dist/wallet-evidence/
      - name: Require every scenario on this exact commit and unchanged pair
        run: python3 .github/packed-wallet/summarize.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: minecraft-jail-packed-wallet-verified-${{ github.sha }}
          path: dist/packed-wallet-verified/
          if-no-files-found: error
          retention-days: 30
