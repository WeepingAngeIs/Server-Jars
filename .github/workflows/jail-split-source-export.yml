name: Export split jail source for review
on:
  push:
    branches: ['codex/jail-standalone-extraction']
    paths: ['.github/workflows/jail-split-source-export.yml']
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: |
          mkdir -p source-review
          git rev-parse HEAD > source-review/commit.txt
          git ls-tree -r HEAD > source-review/tree.txt
          git archive --format=zip --output=source-review/source.zip HEAD .github minecraft-jail unyielding-quests docs ci-inputs AGENTS.md README.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jail-split-current-source
          path: source-review/
          retention-days: 7
