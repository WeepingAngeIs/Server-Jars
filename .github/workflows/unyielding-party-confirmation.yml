name: Jail-free party confirmation races
on:
  workflow_dispatch:
  push:
    branches: ['codex/unyielding-jail-free-followup']
    paths:
      - '.github/party-confirmation/**'
      - '.github/scripts/prepare-party-confirmation.py'
      - '.github/scripts/party-confirmation.sh'
      - '.github/workflows/unyielding-party-confirmation.yml'
      - 'unyielding-quests/src/main/java/dev/unyielding/quests/team/**'
permissions:
  contents: read
jobs:
  party:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: unyielding-quests/*.gradle
      - name: Verify Jail remains unchanged
        run: test "$(git rev-parse HEAD:minecraft-jail)" = a076432b535ebd230fe8ab0681a93ae85e786a69
      - name: Build Unyielding only and run unit tests
        run: |
          python3 .github/scripts/fetch-build-dependencies.py
          chmod +x unyielding-quests/gradlew
          cd unyielding-quests
          ./gradlew --no-daemon --console=plain build
      - name: Assemble jail-free JAR
        run: python3 .github/scripts/assemble-118-followup.py
      - name: Prepare independent two-client fixture
        run: |
          python3 .github/scripts/prepare-party-confirmation.py
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 libopenal1 libxrandr2 libxcursor1 libxinerama1
      - name: Exercise confirmations, reconnect and saved server restart
        env:
          LIBGL_ALWAYS_SOFTWARE: 'true'
          ALSOFT_DRIVERS: 'null'
        run: bash .github/scripts/party-confirmation.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: unyielding-party-confirmation
          path: |
            dist/120-release/
            dist/party-confirmation/
            unyielding-quests/build/test-results/test/
