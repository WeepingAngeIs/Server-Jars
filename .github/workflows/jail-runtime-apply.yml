name: Apply reviewed split jail runtime patch
on:
  push:
    branches: ['codex/jail-standalone-extraction']
    paths: ['.github/workflows/jail-runtime-apply.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: github.ref == 'refs/heads/codex/jail-standalone-extraction'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - name: Verify patch bytes and apply only reviewed source changes
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,gzip,hashlib,pathlib,subprocess
          patch=gzip.decompress(base64.b64decode(pathlib.Path('.github/jail-runtime-transfer.patch.gz.b64').read_text(),validate=True))
          assert hashlib.sha256(patch).hexdigest()=='eece3684cd376789ba945098ec07f6bc0f9ea64f340d0c045b37fc473e3b6bb2'
          path=pathlib.Path('/tmp/reviewed-jail-runtime.patch');path.write_bytes(patch)
          subprocess.run(['git','apply','--check',str(path)],check=True)
          subprocess.run(['git','apply',str(path)],check=True)
          PY
          git fetch --depth=1 origin dc3699ab04e775bd772c38b9ff24646e0791f81a
          python3 .github/scripts/verify-jail-source.py
          python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v
          git diff --check
      - name: Preserve history and push without force
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/scripts/assemble-118-followup.py .github/scripts/verify-jail-source.py .github/scripts/verify-jail-split.py .github/scripts/companion_certificate.py .github/scripts/prepare-split-server.py .github/scripts/run-split-runtime.sh .github/scripts/stable_companion.py .github/scripts/summarize-split-runtime.py .github/scripts/test_companion_certificate.py .github/scripts/verify-split-runtime-evidence.py .github/split-smoke/SplitAssertions.java minecraft-jail/README.md minecraft-jail/RUNTIME-VALIDATION.md minecraft-jail/companion-certificate.json minecraft-jail/src/main/resources/assets/unyieldingquests/jail-certified-runtime.json
          git commit -m 'Certify exact jail-free companion and adapt bounded two-JAR runtime harness'
          git push origin HEAD:refs/heads/codex/jail-standalone-extraction
