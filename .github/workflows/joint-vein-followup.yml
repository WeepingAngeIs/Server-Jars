name: Complete exact-pair certification with hydrated non-jail fixture
on:
  workflow_dispatch:
  push:
    branches: ['codex/joint-wallet-vein-certification']
    paths: ['.github/joint-certification/**', '.github/workflows/joint-vein-followup.yml']
permissions:
  contents: read
  actions: read
jobs:
  vein:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      UQ_ACCESSORY_INTEGRATION: '1'
      LIBGL_ALWAYS_SOFTWARE: 'true'
      ALSOFT_DRIVERS: 'null'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: unyielding-quests/*.gradle
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: pending-joint-pair-b77f51cad7165153dfe23fd341c89edb5c7a7d61
          run-id: 44010514867
          github-token: ${{ github.token }}
          path: dist/joint-pair
      - name: Prepare identical pair with stable hydrated tilling controls
        run: |
          python3 .github/joint-certification/prepare.py vein
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 libopenal1 libxrandr2 libxcursor1 libxinerama1
      - name: Recheck non-jail actions and crowded displays
        run: bash .github/scripts/vein-protection.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: joint-vein-${{ github.sha }}
          path: |
            dist/joint-preparation.json
            dist/vein-protection/
          if-no-files-found: error
  verified:
    needs: vein
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Require successful pinned wallet slices before reusing their reports
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/joint-certification/followup-wait.py
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: pending-joint-pair-b77f51cad7165153dfe23fd341c89edb5c7a7d61
          run-id: 44010514867
          github-token: ${{ github.token }}
          path: dist/joint-pair
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: joint-core-b77f51cad7165153dfe23fd341c89edb5c7a7d61
          run-id: 44010514867
          github-token: ${{ github.token }}
          path: dist/joint-evidence/core
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: joint-faults-b77f51cad7165153dfe23fd341c89edb5c7a7d61
          run-id: 44010514867
          github-token: ${{ github.token }}
          path: dist/joint-evidence/faults
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: joint-integrated-b77f51cad7165153dfe23fd341c89edb5c7a7d61
          run-id: 44010514867
          github-token: ${{ github.token }}
          path: dist/joint-evidence/integrated
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: joint-vein-${{ github.sha }}
          path: dist/joint-evidence/vein
      - name: Bind all phase results to the exact unchanged pair
        env:
          JOINT_WALLET_EVIDENCE_COMMIT: b77f51cad7165153dfe23fd341c89edb5c7a7d61
        run: python3 .github/joint-certification/verify.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-joint-pair-${{ github.sha }}
          path: dist/joint-pair/
