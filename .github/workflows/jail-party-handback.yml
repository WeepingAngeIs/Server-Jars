name: Jail read-only native handback
on:
  workflow_dispatch:
  push:
    branches: ['codex/jail-standalone-extraction']
    paths: ['.github/party-handback/**', '.github/workflows/jail-party-handback.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: jail-party-handback-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        backend: [nbt, json]
    env:
      UQ_ACCESSORY_INTEGRATION: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            unyielding-quests/*.gradle
            unyielding-quests/gradle/wrapper/gradle-wrapper.properties
            combined-unyielding/smoke-harness/*.gradle
      - name: Preserve baseline source, production and paired-release scope
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin 87b2d81d714f5660c3e6bdac93db2fab2a785f00
          python3 - <<'PY'
          import subprocess
          changed=subprocess.check_output(['git','diff','--name-only','87b2d81d714f5660c3e6bdac93db2fab2a785f00','HEAD'],text=True).splitlines()
          assert changed and all(p.startswith(('.github/party-handback/','.github/workflows/jail-party-handback.yml','docs/JAIL-PARTY-HANDBACK-')) for p in changed),changed
          print('\n'.join(changed))
          PY
          git diff --check 87b2d81d714f5660c3e6bdac93db2fab2a785f00 HEAD
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: party-live-verified-87c2b6383ea528b1d604f415c0ffab49131884ac-attempt-1
          run-id: 44019522739
          github-token: ${{ github.token }}
          path: dist/reused-live/
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: packed-wallet-verified-8e9716d94a932fe5110ae84abdc90adfe0017974
          run-id: 43991171187
          github-token: ${{ github.token }}
          path: dist/original-verified/
      - name: Stage exact pair and prepare the independent successor test mod
        run: |
          set -euo pipefail
          cd dist/original-verified
          printf '%s\n' '5c2653a9c14d3199581fdd67e05d055b334ec2746fe7047e3c80454eb732474e  Minecraft-Jail-1.2.0.jar' '61f6add6c68364b1c9dda4486948faf8d104c45ca2db2c40199de64a04ea38f7  Unyielding-1.2.0.jar' | sha256sum -c -
          cd ../..
          mkdir -p dist/120-release minecraft-jail/build/libs
          cp dist/original-verified/Unyielding-1.2.0.jar dist/120-release/
          cp dist/original-verified/Minecraft-Jail-1.2.0.jar minecraft-jail/build/libs/
          python3 .github/scripts/fetch-build-dependencies.py
          python3 .github/party-handback/prepare.py
      - name: Prepare disposable test-client displays
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 libopenal1 libxrandr2 libxcursor1 libxinerama1
      - name: Native fresh epochs, mixed autosave, revoked references and interrupted publication
        run: bash .github/party-handback/run.sh '${{ matrix.backend }}'
      - name: Preserve exact source including failed attempts
        if: always()
        run: |
          mkdir -p dist/handback-source
          git rev-parse HEAD > dist/handback-source/commit.txt
          git archive --format=zip -o dist/handback-source/source.zip HEAD .github/party-handback .github/workflows/jail-party-handback.yml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: party-handback-${{ matrix.backend }}-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: |
            dist/packaged-smoke/
            dist/handback-source/
            dist/reused-live/
            dist/packaged-harness/run/crash-reports/
            dist/packaged-harness/run-server/crash-reports/
            dist/packaged-harness/run-visitor/crash-reports/
          if-no-files-found: error
          retention-days: 30
  verified:
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: party-handback-*-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: evidence/
      - name: Require complete successor evidence without gameplay authorization
        run: |
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          rows=[]
          for backend in ('nbt','json'):
              files=list(Path('evidence').rglob(f'handback-{backend}-summary.json'));assert len(files)==1
              row=json.loads(files[0].read_text());assert row['commit']==os.environ['GITHUB_SHA'] and row['phases']==3 and row['required_phase_observations']==52
              assert row['read_only_native_publication'] is True and all(row[k] is False for k in ('playable_handback_verified','admission_enabled','production_changed'))
              rows.append(row)
          assert rows[0]['source_hashes']==rows[1]['source_hashes']
          Path('handback-verification.json').write_text(json.dumps({'commit':os.environ['GITHUB_SHA'],'runtime_phases':6,'native':rows,'read_only_native_publication':True,'playable_handback_verified':False,'admission_enabled':False,'production_changed':False},indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: party-handback-verified-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: handback-verification.json
          if-no-files-found: error
          retention-days: 30
