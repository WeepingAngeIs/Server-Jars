name: Independent jail-free destination privacy acceptance
on:
  workflow_dispatch:
  push:
    branches: ['codex/unyielding-destination-acceptance']
    paths:
      - '.github/destination-acceptance/**'
      - '.github/scripts/prepare-destination-acceptance.py'
      - '.github/scripts/destination-acceptance.sh'
      - '.github/workflows/unyielding-destination-acceptance.yml'
      - 'unyielding-quests/src/main/java/dev/unyielding/quests/essentials/Destination*'
      - 'unyielding-quests/src/main/java/dev/unyielding/quests/essentials/TeleCmds.java'
      - 'unyielding-quests/src/main/java/dev/unyielding/quests/essentials/CommandGate.java'
      - 'unyielding-quests/src/main/java/dev/unyielding/quests/essentials/Essentials.java'
      - 'unyielding-quests/src/main/java/dev/unyielding/quests/client/DestinationScreen.java'
permissions:
  contents: read
  actions: read
jobs:
  destinations:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: unyielding-quests/*.gradle
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: unyielding-party-provider-acceptance
          run-id: 44031631588
          github-token: ${{ github.token }}
          path: dist/baseline-artifact
      - name: Stage verified meeting candidate; build only a reproduced production fix
        run: |
          git fetch --no-tags --depth=1 origin 3f8cad9f8b648804b52718e85be6c2951def391e
          python3 .github/scripts/fetch-build-dependencies.py
          mkdir -p dist/120-release
          cp dist/baseline-artifact/dist/120-release/Unyielding-1.2.0.jar dist/120-release/
          printf '%s\n' '216de93ca87cc9e0a54f0f0991c675a1058ee95de3247c8efbebffc664f0c504  dist/120-release/Unyielding-1.2.0.jar' | sha256sum -c -
          if ! git diff --quiet 3f8cad9f8b648804b52718e85be6c2951def391e HEAD -- unyielding-quests/src/main .github/scripts/assemble-118-followup.py; then
            (cd unyielding-quests && ./gradlew --no-daemon --console=plain build)
            python3 .github/scripts/assemble-118-followup.py
          fi
      - name: Prepare disposable public clients and destination fixture
        run: |
          python3 .github/scripts/prepare-destination-acceptance.py
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 libopenal1 libxrandr2 libxcursor1 libxinerama1
      - name: Verify own-home payloads, native selector commands and stale feature gates
        env:
          LIBGL_ALWAYS_SOFTWARE: 'true'
          ALSOFT_DRIVERS: 'null'
        run: bash .github/scripts/destination-acceptance.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: unyielding-destination-acceptance
          path: |
            dist/120-release/
            dist/destination-acceptance/
            unyielding-quests/build/test-results/test/
          if-no-files-found: error
