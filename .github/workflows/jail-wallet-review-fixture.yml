name: Assert saved-return final review in wallet fixture
on:
  push:
    branches: ['codex/jail-packed-wallet-custody']
    paths: ['.github/workflows/jail-wallet-review-fixture.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Exercise the unchanged recover, review and restore authority protocol
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/codex/jail-packed-wallet-custody
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          base='0e3cfd4d26b1cf147306140cf6246ddd859d2480'
          p=Path('.github/packed-wallet/PackedWalletCustodySmoke.java')
          assert p.read_bytes()==subprocess.check_output(['git','show',base+':'+str(p)])
          s=p.read_text()
          old='proof(command("jailcustody recover "+tx)==1,"saved_return_explicitly_confirmed_without_regrant");returned();disconnect();'
          new='proof(command("jailcustody recover "+tx)==1,"saved_return_explicitly_confirmed_without_regrant");completeRecoveredReturn();returned();disconnect();'
          assert s.count(old)==1;s=s.replace(old,new,1)
          old='    static void admit()throws Exception {'
          new='''    static void completeRecoveredReturn()throws Exception {
                  byte[] before=items().current().inventory();
                  proof(Arrays.equals(original,before)&&JailCustodyService.quarantined(player)
                          &&JailData.get(admin.server).assignment(owner)==null
                          &&binding().state()==JailCustodyLedger.State.QUARANTINED,
                          "saved_return_waits_for_explicit_final_review");
                  stored("COMPLETE");
                  proof(command("unjail Visitor")==0&&Arrays.equals(before,items().current().inventory()),
                          "normal_unjail_cannot_skip_recovery_review");
                  proof(command("jailcustody restore "+tx)==0&&Arrays.equals(before,items().current().inventory()),
                          "unreviewed_saved_return_cannot_finish");
                  proof(command("jailcustody review "+tx)==1&&command("jailcustody restore "+tx)==1
                          &&Arrays.equals(before,items().current().inventory()),
                          "final_review_completed_without_resource_regrant");
              }
              static void admit()throws Exception {'''
          assert s.count(old)==1;p.write_text(s.replace(old,new,1))
          p=Path('.github/packed-wallet/verify.py');assert p.read_bytes()==subprocess.check_output(['git','show',base+':'+str(p)])
          s=p.read_text();old="('return-saved',3):['saved_return_receipt_and_complete_wallet_survived_abrupt_stop','saved_return_explicitly_confirmed_without_regrant'],"
          new="('return-saved',3):['saved_return_receipt_and_complete_wallet_survived_abrupt_stop','saved_return_explicitly_confirmed_without_regrant','saved_return_waits_for_explicit_final_review','normal_unjail_cannot_skip_recovery_review','unreviewed_saved_return_cannot_finish','final_review_completed_without_resource_regrant'],"
          assert s.count(old)==1;p.write_text(s.replace(old,new,1))
          p=Path('.github/packed-wallet/test_verify.py');s=p.read_text();old="if __name__=='__main__':unittest.main()"
          new='''    def test_missing_final_review_is_not_a_pass(self):
                  r=self.report('return-saved',3);del r['final_review_completed_without_resource_regrant']
                  with self.assertRaises(ValueError):self.check(r)
              def test_false_final_review_gate_is_not_a_pass(self):
                  r=self.report('return-saved',3);r['unreviewed_saved_return_cannot_finish']=False
                  with self.assertRaises(ValueError):self.check(r)
          if __name__=='__main__':unittest.main()'''
          assert s.count(old)==1;p.write_text(s.replace(old,new,1))
          p=Path('.github/packed-wallet/FIXTURE-NOTES.md')
          p.write_text(p.read_text()+'''\n## Saved-return recovery is not final release\n\nRun `43973652674` at `0e3cfd4d` proved the saved wallet return after an\nactual abrupt stop, then correctly found that the existing custody ledger\nremains QUARANTINED after `jailcustody recover`. The fixture had incorrectly\nexpected recovery alone to release that administrative hold.\n\nThe fixture now explicitly proves that exact items and receipts are retained,\nthe spatial assignment is complete, ordinary unjail cannot skip the hold,\nand restore without review is refused. It then invokes the existing native\n`jailcustody review <transaction>` and `jailcustody restore <transaction>`\ncommands and verifies completion without any additional resource grant.\nTwo validator tests reject missing/false final-review evidence. No production\nlogic or safety gate was changed to satisfy this test.\n''')
          p=Path('minecraft-jail/PACKED-WALLET-CUSTODY.md')
          s=p.read_text();old='it must not recreate resources from an unreceipted ambiguous operation.'
          new=old+' Recovery deliberately retains the custody-ledger hold even after confirming completed native returns. Final release requires the existing explicit `jailcustody review <transaction>` followed by `jailcustody restore <transaction>`; these confirm completion without another item grant. Ordinary unjail cannot skip this review.'
          assert s.count(old)==1;p.write_text(s.replace(old,new,1))
          PY
          python3 -m unittest discover -s .github/packed-wallet -p test_verify.py -v
          git diff --check
          git diff --exit-code HEAD -- minecraft-jail/src/main unyielding-quests combined-unyielding minecraft-jail/companion-certificate.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/packed-wallet/PackedWalletCustodySmoke.java .github/packed-wallet/verify.py .github/packed-wallet/test_verify.py .github/packed-wallet/FIXTURE-NOTES.md minecraft-jail/PACKED-WALLET-CUSTODY.md
          git commit -m 'Verify mandatory administrator review after saved wallet return; never bypass ledger quarantine'
          git fetch origin codex/jail-packed-wallet-custody
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/codex/jail-packed-wallet-custody
