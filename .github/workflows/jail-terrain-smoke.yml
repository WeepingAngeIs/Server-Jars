name: Jail terrain placement and recovery smoke
on:
  workflow_dispatch:
  push:
    branches: ['codex/recovery-review-safe']
permissions:
  contents: read
jobs:
  terrain:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare public dependencies
        run: |
          python3 .github/scripts/fetch-build-dependencies.py
          for d in run-server run run-visitor; do mkdir -p "unyielding-quests/$d/mods"; done
          curl --fail --location --retry 3 'https://cdn.modrinth.com/data/gF3BGWvG/versions/yWmXD7GW/open-parties-and-claims-neoforge-1.21.1-0.33.0.jar' -o unyielding-quests/run-server/mods/opac.jar
          echo '646fd9796ef2dfd1132e22aacf1a417639233d90fb7eb862a718badfed955d54714c88327b7ddc651f98cd5b7d2a80e8c91233d2232680d4998fdd10ef392ffb  unyielding-quests/run-server/mods/opac.jar' | sha512sum -c -
          cp unyielding-quests/run-server/mods/opac.jar unyielding-quests/run/mods/
          cp unyielding-quests/run-server/mods/opac.jar unyielding-quests/run-visitor/mods/
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 libopenal1 libxrandr2 libxcursor1 libxinerama1
      - name: Exercise preview, placement and simulated interruption recovery
        env:
          UQ_WORLD_NAME: jail_terrain_smoke
          UQ_RESULT_FILE: /tmp/uq-jail-terrain-result
          LIBGL_ALWAYS_SOFTWARE: 'true'
          ALSOFT_DRIVERS: 'null'
        run: |
          export JAVA_TOOL_OPTIONS='-Duq.jailTerrainPlayers=true -Duq.jailTerrainPhase=1'
          bash .github/scripts/meeting-two-player.sh
          cp /tmp/uq-jail-terrain-result /tmp/uq-jail-terrain-phase1
          cp -a meeting-two-player-logs meeting-two-player-terrain-phase1
          export JAVA_TOOL_OPTIONS='-Duq.jailTerrainPlayers=true -Duq.jailTerrainPhase=2'
          bash .github/scripts/meeting-two-player.sh
          cat /tmp/uq-jail-terrain-phase1 /tmp/uq-jail-terrain-result
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: jail-terrain-smoke-logs
          path: |
            meeting-two-player-logs/
            meeting-two-player-terrain-phase1/
          if-no-files-found: warn
