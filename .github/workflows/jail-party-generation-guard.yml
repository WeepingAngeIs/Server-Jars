name: Jail party generation safeguards
on:
  workflow_dispatch:
  push:
    branches: ['codex/jail-standalone-extraction']
    paths:
      - 'minecraft-jail/src/partySafety/**'
      - 'minecraft-jail/src/partySafetyNative/**'
      - 'minecraft-jail/src/partySafetyTest/**'
      - '.github/party-guard/**'
      - '.github/workflows/jail-party-generation-guard.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: jail-party-generation-guard-${{ github.ref }}
  cancel-in-progress: false
jobs:
  scope-unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Enforce Jail-only unregistered source scope
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin cdcf7737817b7ac93c81d297e8614765d2d4dc38
          python3 - <<'PY'
          import subprocess
          allowed=('minecraft-jail/src/partySafety/','minecraft-jail/src/partySafetyNative/','minecraft-jail/src/partySafetyTest/','.github/party-guard/','.github/workflows/jail-party-generation-guard.yml','docs/JAIL-PARTY-GUARD-')
          changed=subprocess.check_output(['git','diff','--name-only','cdcf7737817b7ac93c81d297e8614765d2d4dc38','HEAD'],text=True).splitlines()
          assert changed and all(p.startswith(allowed) for p in changed),changed
          print('\n'.join(changed))
          PY
          git diff --check cdcf7737817b7ac93c81d297e8614765d2d4dc38 HEAD
      - name: Compile and test new safeguards including six abrupt JVM exits
        run: |
          set -euo pipefail
          mkdir -p dist/party-guard-unit/classes
          javac --release 21 -d dist/party-guard-unit/classes minecraft-jail/src/partySafety/java/dev/unyielding/jail/party/*.java minecraft-jail/src/partySafetyTest/java/dev/unyielding/jail/party/*.java
          java -cp dist/party-guard-unit/classes dev.unyielding.jail.party.PartyGuardTests "$RUNNER_TEMP/party-guard-tests" | tee dist/party-guard-unit/tests.log
          cp "$RUNNER_TEMP/party-guard-tests/unit-results.json" dist/party-guard-unit/
          python3 - <<'PY'
          import json,os,hashlib
          from pathlib import Path
          r=json.loads(Path('dist/party-guard-unit/unit-results.json').read_text());assert r['passed']==34 and r['failed']==0 and r['admission_enabled'] is False
          r['commit']=os.environ['GITHUB_SHA'];r['source_hashes']={str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in Path('minecraft-jail/src/partySafety').rglob('*.java')}
          Path('dist/party-guard-unit/unit-summary.json').write_text(json.dumps(r,indent=2)+'\n')
          PY
          git archive --format=zip -o dist/party-guard-unit/source.zip HEAD minecraft-jail/src/partySafety minecraft-jail/src/partySafetyNative minecraft-jail/src/partySafetyTest .github/party-guard .github/workflows/jail-party-generation-guard.yml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: party-guard-unit-${{ github.sha }}
          path: |
            dist/party-guard-unit/*.json
            dist/party-guard-unit/*.log
            dist/party-guard-unit/source.zip
          if-no-files-found: error
          retention-days: 30
  native:
    needs: scope-unit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        backend: [nbt, json]
    env:
      UQ_ACCESSORY_INTEGRATION: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            unyielding-quests/*.gradle
            unyielding-quests/gradle/wrapper/gradle-wrapper.properties
            combined-unyielding/smoke-harness/*.gradle
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: packed-wallet-verified-8e9716d94a932fe5110ae84abdc90adfe0017974
          run-id: 43991171187
          github-token: ${{ github.token }}
          path: dist/original-verified/
      - name: Reuse unchanged exact pair and prepare separate test-mod gateway
        run: |
          set -euo pipefail
          cd dist/original-verified
          printf '%s\n' '5c2653a9c14d3199581fdd67e05d055b334ec2746fe7047e3c80454eb732474e  Minecraft-Jail-1.2.0.jar' '61f6add6c68364b1c9dda4486948faf8d104c45ca2db2c40199de64a04ea38f7  Unyielding-1.2.0.jar' | sha256sum -c -
          cd ../..
          mkdir -p dist/120-release minecraft-jail/build/libs
          cp dist/original-verified/Unyielding-1.2.0.jar dist/120-release/
          cp dist/original-verified/Minecraft-Jail-1.2.0.jar minecraft-jail/build/libs/
          python3 .github/scripts/fetch-build-dependencies.py
          python3 .github/party-guard/prepare.py
      - name: Prepare disposable client displays
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 libopenal1 libxrandr2 libxcursor1 libxinerama1
      - name: Exercise guards against native failure regressions across three independent starts
        run: bash .github/party-guard/run.sh '${{ matrix.backend }}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: party-guard-native-${{ matrix.backend }}-${{ github.sha }}
          path: |
            dist/packaged-smoke/
            dist/packaged-harness/run-server/crash-reports/
          if-no-files-found: error
          retention-days: 30
  verified:
    needs: [scope-unit, native]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: party-guard-*-${{ github.sha }}
          path: evidence/
      - name: Require complete exact-commit unit and native evidence
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,os
          root=Path('evidence');sha=os.environ['GITHUB_SHA']
          units=list(root.rglob('unit-summary.json'));assert len(units)==1
          unit=json.loads(units[0].read_text());assert unit['commit']==sha and unit['passed']==34 and unit['failed']==0
          summaries=[]
          for backend in ('nbt','json'):
              paths=list(root.rglob(f'party-guard-{backend}-summary.json'));assert len(paths)==1
              s=json.loads(paths[0].read_text());assert s['commit']==sha and s['phases']==3 and s['guard_flags']==15 and s['legacy_counterexample_flags']==14
              assert s['admission_verified'] is False and s['global_native_hooks_installed'] is False and s['production_jar_changed'] is False
              for path,digest in unit['source_hashes'].items():assert s['sources'][path]==digest
              summaries.append(s)
          Path('guard-verification.json').write_text(json.dumps({'commit':sha,'unit':unit,'native':summaries,'runtime_phases':6,'nonempty_admission_verified':False,'production_changed':False},indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: party-guard-verified-${{ github.sha }}
          path: guard-verification.json
          if-no-files-found: error
          retention-days: 30
