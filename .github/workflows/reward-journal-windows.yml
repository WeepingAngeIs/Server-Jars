name: Reward journal Windows compatibility
on:
  push:
    branches: ['codex/unyielding-improvements-wip']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-journal:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify forced journal write and reopen
        shell: pwsh
        run: |
          @'
          import dev.unyielding.quests.spin.RewardJournal;
          import java.nio.file.*;
          import java.util.UUID;
          class JournalWindowsCheck {
            public static void main(String[] args) throws Exception {
              Path path=Paths.get("journal-check"); UUID id=UUID.randomUUID();
              try(var j=new RewardJournal(path)){j.begin(id, UUID.randomUUID(), 2, new byte[]{1});}
              try(var j=new RewardJournal(path)){if(j.read(id)==null)throw new Exception("missing journal record");}
            }
          }
          '@ | Set-Content -Encoding utf8 JournalWindowsCheck.java
          javac -d . unyielding-quests/src/main/java/dev/unyielding/quests/spin/RewardJournal.java JournalWindowsCheck.java
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          java JournalWindowsCheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
