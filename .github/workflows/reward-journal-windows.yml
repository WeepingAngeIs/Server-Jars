name: Reward journal Windows compatibility
on:
  push:
    branches: ['codex/unyielding-improvements-wip', 'codex/recovery-review-safe']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-journal:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify forced journal write and reopen
        shell: pwsh
        run: |
          @'
          import dev.unyielding.quests.spin.RewardJournal;
          import java.nio.file.*;
          import java.util.UUID;
          class JournalWindowsCheck {
            public static void main(String[] args) throws Exception {
              Path path=Paths.get("journal-check"); UUID id=UUID.randomUUID();
              RewardJournal.provisionNew(path);
              UUID player=UUID.randomUUID(), generation=UUID.randomUUID(), creditId;
              try(var j=new RewardJournal(path)){creditId=j.creditQuest(player,42,generation).id();}
              try(var j=new RewardJournal(path)){j.begin(id, UUID.randomUUID(), 2, new byte[]{1});}
              try(var j=new RewardJournal(path)){
                if(j.read(id)==null)throw new Exception("missing journal record");
                if(!creditId.equals(j.creditQuest(player,42,generation).id()) || j.questCredits().size()!=1)throw new Exception("duplicated quest credit");
                if(!j.balanceChanges().get(0).credit() || j.balanceChanges().get(1).credit())throw new Exception("lost balance order");
                j.transition(id, RewardJournal.State.PREPARED, RewardJournal.State.DEBIT_APPLIED);
                j.transition(id, RewardJournal.State.DEBIT_APPLIED, RewardJournal.State.DELIVERING);
              }
              try(var j=new RewardJournal(path)){
                if(j.read(id).state()!=RewardJournal.State.DELIVERING)throw new Exception("lost crash boundary");
                j.transition(id, RewardJournal.State.DELIVERING, RewardJournal.State.HELD);
              }
              Path file=path.resolve("reward-journal.v1"); byte[] original=Files.readAllBytes(file);
              Files.write(file, java.util.Arrays.copyOf(original,original.length-1));
              expectFailure(path);
              Files.delete(file); expectFailure(path);
              if(Files.exists(file))throw new Exception("silently recreated history");
              try { RewardJournal.provisionNew(path); throw new AssertionError("reprovisioned"); }
              catch(java.io.IOException expected) {}
            }
            static void expectFailure(Path path) throws Exception {
              try(var j=new RewardJournal(path)){throw new AssertionError("unsafe open");}
              catch(java.io.IOException expected) {}
            }
          }
          '@ | Set-Content -Encoding utf8 JournalWindowsCheck.java
          javac -d . unyielding-quests/src/main/java/dev/unyielding/quests/spin/RewardJournal.java JournalWindowsCheck.java
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          java JournalWindowsCheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
