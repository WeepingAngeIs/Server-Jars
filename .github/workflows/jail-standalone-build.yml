name: Build and verify standalone jail without launching Minecraft
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: standalone-jail-${{ github.ref }}
  cancel-in-progress: false
jobs:
  split-code-verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      BASE_COMMIT: dc3699ab04e775bd772c38b9ff24646e0791f81a
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            unyielding-quests/*.gradle
            unyielding-quests/gradle.properties
            unyielding-quests/gradle/wrapper/gradle-wrapper.properties
            minecraft-jail/*.gradle
            minecraft-jail/gradle.properties
      - name: Verify exact source provenance and static test suite
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "$BASE_COMMIT"
          mkdir -p dist/jail-evidence
          python3 .github/scripts/verify-jail-source.py | tee dist/jail-evidence/source-provenance.json
          python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v 2>&1 | tee dist/jail-evidence/python-tests.txt
          python3 -m py_compile .github/scripts/*.py
      - name: Fetch checksum-pinned compile dependencies
        run: |
          set -euo pipefail
          python3 .github/scripts/fetch-build-dependencies.py
          mkdir -p minecraft-jail/libs
          cp unyielding-quests/libs/cobblemon.jar unyielding-quests/libs/kotlin-stdlib.jar minecraft-jail/libs/
      - name: Independently build original integrated reference without game launches
        run: |
          set -euo pipefail
          REF="$RUNNER_TEMP/jail-integrated-reference"
          git worktree add --detach "$REF" "$BASE_COMMIT"
          mkdir -p "$REF/unyielding-quests/libs"
          cp unyielding-quests/libs/*.jar "$REF/unyielding-quests/libs/"
          (cd "$REF/unyielding-quests" && sh gradlew --no-daemon --console=plain build) 2>&1 | tee dist/jail-evidence/reference-build.log
          (cd "$REF" && python3 .github/scripts/assemble-118-followup.py) 2>&1 | tee dist/jail-evidence/reference-assembly.log
          cp -a "$REF/unyielding-quests/build/test-results" dist/jail-evidence/reference-test-results
      - name: Build and unit-test jail-free Unyielding component
        run: |
          set -euo pipefail
          (cd unyielding-quests && sh gradlew --no-daemon --console=plain build) 2>&1 | tee dist/jail-evidence/unyielding-build.log
      - name: Build and unit-test independent Minecraft Jail module
        run: |
          set -euo pipefail
          (cd minecraft-jail && sh gradlew --no-daemon --console=plain build) 2>&1 | tee dist/jail-evidence/jail-build.log
      - name: Assemble Unyielding and verify both outputs independently
        run: |
          set -euo pipefail
          python3 .github/scripts/assemble-118-followup.py 2>&1 | tee dist/jail-evidence/unyielding-assembly.log
          python3 .github/scripts/verify-jail-split.py --before "$RUNNER_TEMP/jail-integrated-reference/dist/120-release/Unyielding-1.2.0.jar" | tee dist/jail-evidence/output-verification.json
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Upload verified code-only JAR pair
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jail-split-code-only-${{ github.sha }}
          path: dist/jail-split/
          if-no-files-found: error
          retention-days: 30
      - name: Upload exact-commit test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jail-split-evidence-${{ github.sha }}
          path: |
            dist/jail-evidence/
            unyielding-quests/build/test-results/
            minecraft-jail/build/test-results/
          if-no-files-found: warn
          retention-days: 30
